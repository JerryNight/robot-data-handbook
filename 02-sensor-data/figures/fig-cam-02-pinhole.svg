<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">针孔模型：为什么公式里要“除以 Z”</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">小孔成像只有一件事：光走直线。于是“远近”变成了“大小”。</text>
  <line x1="150.0" y1="176.0" x2="720.0" y2="176.0" stroke="#C4CDD6" stroke-width="1" opacity="1.0" stroke-dasharray="4 4"/>
  <line x1="250.0" y1="76.0" x2="250.0" y2="306.0" stroke="#B0B9C2" stroke-width="2" opacity="1.0"/>
  <text x="250.0" y="68.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">像平面（传感器）</text>
  <rect x="531.0" y="126.0" width="28.0" height="100.0" rx="3" fill="#EDF1F5" stroke="#3C6E9F" stroke-width="1.6" opacity="1.0"/>
  <rect x="531.0" y="126.0" width="28.0" height="8.0" rx="3" fill="#C9D2DB" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="545.0" y="248.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">同一个杯子</text>
  <text x="545.0" y="262.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">1 m 远</text>
  <line x1="567.0" y1="126.0" x2="567.0" y2="226.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <line x1="563.0" y1="126.0" x2="571.0" y2="126.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <line x1="563.0" y1="226.0" x2="571.0" y2="226.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="574.0" y="180.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">8 cm</text>
  <rect x="676.0" y="126.0" width="28.0" height="100.0" rx="3" fill="#EDF1F5" stroke="#C0651A" stroke-width="1.6" opacity="1.0"/>
  <rect x="676.0" y="126.0" width="28.0" height="8.0" rx="3" fill="#C9D2DB" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="690.0" y="248.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">同一个杯子</text>
  <text x="690.0" y="262.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">2 m 远</text>
  <line x1="668.0" y1="126.0" x2="668.0" y2="226.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <line x1="664.0" y1="126.0" x2="672.0" y2="126.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <line x1="664.0" y1="226.0" x2="672.0" y2="226.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="661.0" y="180.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">8 cm</text>
  <line x1="545.0" y1="126.0" x2="250.0" y2="201.6" stroke="#3C6E9F" stroke-width="1.2" opacity="0.55"/>
  <line x1="545.0" y1="226.0" x2="250.0" y2="150.4" stroke="#3C6E9F" stroke-width="1.2" opacity="0.55"/>
  <line x1="244.0" y1="201.6" x2="244.0" y2="150.4" stroke="#3C6E9F" stroke-width="5" opacity="1.0"/>
  <line x1="690.0" y1="126.0" x2="250.0" y2="190.7" stroke="#C0651A" stroke-width="1.2" opacity="0.55"/>
  <line x1="690.0" y1="226.0" x2="250.0" y2="161.3" stroke="#C0651A" stroke-width="1.2" opacity="0.55"/>
  <line x1="256.0" y1="190.7" x2="256.0" y2="161.3" stroke="#C0651A" stroke-width="5" opacity="1.0"/>
  <circle cx="350.0" cy="176.0" r="3.5" fill="#1F2328" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="350.0" y="164.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">小孔</text>
  <line x1="250.0" y1="306.0" x2="350.0" y2="306.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <line x1="250.0" y1="302.0" x2="250.0" y2="310.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <line x1="350.0" y1="302.0" x2="350.0" y2="310.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <text x="300.0" y="320.0" font-size="10" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">f</text>
  <text x="40.0" y="118.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">像平面上的高度</text>
  <line x1="40.0" y1="136.0" x2="62.0" y2="136.0" stroke="#3C6E9F" stroke-width="4" opacity="1.0"/>
  <text x="70.0" y="140.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">1 m 处：42 像素高</text>
  <line x1="40.0" y1="160.0" x2="62.0" y2="160.0" stroke="#C0651A" stroke-width="4" opacity="1.0"/>
  <text x="70.0" y="164.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">2 m 处：21 像素高</text>
  <text x="40.0" y="196.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">距离翻倍，</text>
  <text x="40.0" y="212.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">像高减半。</text>
  <rect x="24.0" y="340.0" width="712.0" height="76.0" rx="7" fill="#F7F9FB" stroke="#DDE3E9" stroke-width="1.1" opacity="1.0"/>
  <text x="38.0" y="362.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">相似三角形 → 像高 / f = 物高 / Z</text>
  <text x="38.0" y="382.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">把像高换成像素坐标，就是 u = fx · X / Z + cx。那个除号，就是“近大远小”的全部来源。</text>
  <text x="38.0" y="402.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">记住这一点：投影是除法。所以图像上的“远近”被压扁了 —— 这也是为什么单目相机量不出距离。</text>
</svg>