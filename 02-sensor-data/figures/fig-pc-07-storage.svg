<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="344" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">同一帧点云，五种存法的体积差 22 倍</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">16 线、28,800 点/帧。横轴对数，单位 KB/帧。</text>
  <line x1="307.0" y1="78.0" x2="307.0" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="307.0" y="314.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <line x1="397.9" y1="78.0" x2="397.9" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="397.9" y="314.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">200</text>
  <line x1="518.1" y1="78.0" x2="518.1" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="518.1" y="314.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">500</text>
  <line x1="609.1" y1="78.0" x2="609.1" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="609.1" y="314.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1000</text>
  <line x1="700.0" y1="78.0" x2="700.0" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="700.0" y="314.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">2000</text>
  <text x="470.0" y="332.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">KB / 帧（对数）</text>
  <text x="24.0" y="104.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">PCD ascii</text>
  <text x="24.0" y="118.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">文本，能直接 cat 看</text>
  <rect x="240.0" y="92.0" width="437.8" height="16.0" rx="2" fill="#8A94A0" stroke="#8A94A0" stroke-width="0" opacity="1.0"/>
  <text x="683.8" y="104.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">1688 KB</text>
  <text x="24.0" y="148.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">PCD binary</text>
  <text x="24.0" y="162.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">原始 16 B/点</text>
  <rect x="240.0" y="136.0" width="264.3" height="16.0" rx="2" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="1.0"/>
  <text x="510.3" y="148.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">450 KB</text>
  <text x="24.0" y="192.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">量化 16 位坐标 + 8 位强度</text>
  <text x="24.0" y="206.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">7 B/点</text>
  <rect x="240.0" y="180.0" width="156.0" height="16.0" rx="2" fill="#4F82B0" stroke="#4F82B0" stroke-width="0" opacity="1.0"/>
  <text x="402.0" y="192.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">197 KB</text>
  <text x="24.0" y="236.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">Draco 压缩（5:1）</text>
  <text x="24.0" y="250.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">计算换体积</text>
  <rect x="240.0" y="224.0" width="53.2" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="1.0"/>
  <text x="299.2" y="236.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">90 KB</text>
  <text x="24.0" y="280.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">range image + PNG</text>
  <text x="24.0" y="294.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">重投影，有损</text>
  <rect x="240.0" y="268.0" width="29.3" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="1.0"/>
  <text x="275.3" y="280.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">75 KB</text>
</svg>
