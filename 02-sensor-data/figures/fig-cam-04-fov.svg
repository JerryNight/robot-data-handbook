  <text x="24.0" y="350.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">焦距越长，看得越窄，但每个像素代表的物理尺寸越细。这两件事是同一个除法的两面。</text>
