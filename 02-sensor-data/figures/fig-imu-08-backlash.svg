  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">回差：同样的指令，正着走和反着走落在两个不同的状态</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">图上把间隙放大了 150 倍，否则 0.02° 在 90° 的坐标里是一条看不见的线。</text>
