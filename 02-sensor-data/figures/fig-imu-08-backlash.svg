  <text x="122.0" y="115.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">正着走（上行）</text>
  <line x1="96.0" y1="130.0" x2="116.0" y2="130.0" stroke="#3C6E9F" stroke-width="2.6" opacity="1.0"/>
  <text x="122.0" y="133.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">反着走（下行）</text>
  <line x1="284.2" y1="198.7" x2="284.2" y2="184.6" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/>
  <line x1="279.2" y1="198.7" x2="289.2" y2="198.7" stroke="#C0392B" stroke-width="1.2" opacity="1.0"/>
  <line x1="279.2" y1="184.6" x2="289.2" y2="184.6" stroke="#C0392B" stroke-width="1.2" opacity="1.0"/>
  <line x1="284.2" y1="198.7" x2="360.2" y2="243.5" stroke="#B9C2CB" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <text x="364.2" y="243.5" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">同一指令，两个状态</text>
  <text x="364.2" y="258.5" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">真实 0.02°，图上 3°</text>
  <rect x="510.0" y="96.0" width="226.0" height="92.0" rx="7" fill="#F7F9FB" stroke="#D6DDE4" stroke-width="1.1" opacity="1.0"/>
  <text x="524.0" y="118.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">真实回差 72″ ≈ 0.02°</text>
  <text x="524.0" y="138.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">在 0.5 m 臂展处</text>
  <text x="524.0" y="154.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">= 0.175 mm 的位置差</text>
  <text x="524.0" y="174.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而编码器能分辨 0.00007°</text>
  <text x="510.0" y="216.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">这对数据意味着什么</text>
  <text x="510.0" y="236.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">同一段动作重复两次，</text>
  <text x="510.0" y="252.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">状态轨迹不完全重合 ——</text>
  <text x="510.0" y="268.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">取决于上次运动的方向。</text>
  <text x="510.0" y="290.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">它不随机，但也不可预测：</text>
  <text x="510.0" y="306.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">是模仿学习里最难受的</text>
  <text x="510.0" y="322.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">一类噪声。</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">缓解办法：采集时记录运动方向，事后做回差补偿。工业机器人常这么做，但开源数据集基本不记。</text>
</svg>
