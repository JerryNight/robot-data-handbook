  <line x1="90.0" y1="158.7" x2="470.0" y2="158.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="84.0" y="161.7" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">60</text>
  <line x1="343.3" y1="300.0" x2="343.3" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="343.3" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">60</text>
  <line x1="90.0" y1="88.0" x2="470.0" y2="88.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="84.0" y="91.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">90</text>
  <line x1="470.0" y1="300.0" x2="470.0" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="470.0" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">90</text>
  <text x="90.0" y="82.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">实际关节角 (°)</text>
  <text x="470.0" y="336.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">指令关节角 (°)</text>
