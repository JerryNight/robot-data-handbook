  <text x="712.0" y="290.8" font-size="9" fill="#3C6E9F" text-anchor="end" font-weight="400" opacity="1.0">零偏 0.010</text>
  <circle cx="463.2" cy="262.0" r="3.6" fill="#C0392B" stroke="#ffffff" stroke-width="1.2" opacity="1.0"/>
  <line x1="463.2" y1="262.0" x2="546.6" y2="144.4" stroke="#B9C2CB" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <text x="551.7" y="126.7" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">1° → 0.171 m/s²</text>
  <text x="551.7" y="144.4" font-size="8.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">零偏的 17 倍</text>
  <text x="400.0" y="358.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">注意纵轴：泄漏在 0.06° 处就已经和零偏一样大了。</text>
  <text x="400.0" y="376.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">所以姿态精度比零偏校准重要得多 —— 前者放大 17 倍，后者只是一个常数。</text>
</svg>
