<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="404" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">姿态误差的杀伤力：它把重力“歪”到了水平方向上</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">加速度计分不清“真的在加速”和“重力歪了一点”—— 后者产生的假信号要大得多。</text>
  <line x1="40.0" y1="138.0" x2="240.0" y2="138.0" stroke="#CFD6DD" stroke-width="1" opacity="1.0" stroke-dasharray="4 3"/>
  <text x="40.0" y="131.0" font-size="8" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">水平</text>
  <g transform="rotate(-25 148 138)">
  <rect x="114.0" y="118.0" width="68.0" height="40.0" rx="3" fill="#E3E0F0" stroke="#7A6A9E" stroke-width="1.4" opacity="1.0"/>
  <text x="148.0" y="142.0" font-size="8.5" fill="#5D4F80" text-anchor="middle" font-weight="600" opacity="1.0">IMU</text>
  </g>
  <line x1="111.2" y1="155.1" x2="148.0" y2="234.0" stroke="#B9C2CB" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <line x1="184.8" y1="216.9" x2="148.0" y2="234.0" stroke="#B9C2CB" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <line x1="148.0" y1="138.0" x2="182.0" y2="211.0" stroke="#3C6E9F" stroke-width="2.2"/>
  <polygon points="184.8,216.9 185.3,209.5 178.8,212.5" fill="#3C6E9F"/>
  <line x1="148.0" y1="138.0" x2="117.1" y2="152.4" stroke="#C0392B" stroke-width="2.2"/>
  <polygon points="111.2,155.1 118.6,155.6 115.6,149.2" fill="#C0392B"/>
  <line x1="148.0" y1="138.0" x2="148.0" y2="227.5" stroke="#1F2328" stroke-width="2.2"/>
  <polygon points="148.0,234.0 151.6,227.5 144.4,227.5" fill="#1F2328"/>
  <text x="192.8" y="220.9" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">g·cosθ</text>
  <text x="192.8" y="234.9" font-size="8" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">传感器该读到这个</text>
  <text x="107.2" y="173.1" font-size="9.5" fill="#C0392B" text-anchor="end" font-weight="600" opacity="1.0">g·sinθ</text>
  <text x="107.2" y="187.1" font-size="8" fill="#C0392B" text-anchor="end" font-weight="400" opacity="1.0">← 这个就是泄漏</text>
  <text x="155.0" y="230.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">g</text>
  <path d="M 208 138 A 60 60 0 0 0 202.4 112.6" fill="none" stroke="#57606A" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <text x="214.0" y="122.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="600" opacity="1.0">θ</text>
  <text x="40.0" y="282.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">倾斜 1° 时，水平分量：</text>
  <text x="40.0" y="302.0" font-size="11" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">9.81 × sin 1° = 0.171 m/s²</text>
  <text x="40.0" y="324.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而这只 IMU 的零偏只有 0.010 ——</text>
  <text x="40.0" y="340.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一个 1° 的姿态误差，就够抵消</text>
  <text x="40.0" y="356.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">17 倍的硬件精度。</text>
  <line x1="400.0" y1="300.0" x2="716.0" y2="300.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="394.0" y="303.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">0</text>
