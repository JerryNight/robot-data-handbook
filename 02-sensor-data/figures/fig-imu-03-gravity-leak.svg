  <text x="394.0" y="236.3" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">0.3</text>
  <line x1="400.0" y1="166.7" x2="716.0" y2="166.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="394.0" y="169.7" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">0.6</text>
  <line x1="400.0" y1="100.0" x2="716.0" y2="100.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="394.0" y="103.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">0.9</text>
  <line x1="400.0" y1="300.0" x2="400.0" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="400.0" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">0</text>
  <line x1="463.2" y1="300.0" x2="463.2" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="463.2" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">1</text>
  <line x1="526.4" y1="300.0" x2="526.4" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="526.4" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">2</text>
  <line x1="589.6" y1="300.0" x2="589.6" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="589.6" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">3</text>
  <line x1="652.8" y1="300.0" x2="652.8" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="652.8" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">4</text>
  <line x1="716.0" y1="300.0" x2="716.0" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="716.0" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">5</text>
  <text x="716.0" y="336.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">姿态误差 (°)</text>
  <text x="394.0" y="92.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">等效水平加速度 (m/s²)</text>
