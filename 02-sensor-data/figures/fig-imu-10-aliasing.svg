  <text x="110.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">真实的 40 Hz</text>
  <line x1="196.0" y1="306.0" x2="222.0" y2="306.0" stroke="#C0651A" stroke-width="1.8" opacity="1.0" stroke-dasharray="5 3"/>
  <text x="228.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">真实的 60 Hz</text>
  <circle cx="320.0" cy="306.0" r="4.0" fill="#ffffff" stroke="#1F2328" stroke-width="1.6" opacity="1.0"/>
  <text x="330.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">100 Hz 采样点（两条线共用）</text>
  <rect x="500.0" y="96.0" width="236.0" height="100.0" rx="7" fill="#F7F9FB" stroke="#D6DDE4" stroke-width="1.1" opacity="1.0"/>
  <text x="514.0" y="118.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">折叠规则</text>
  <text x="514.0" y="140.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">真实频率 f 被采样率 fs</text>
  <text x="514.0" y="156.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">折到 |f − fs| 上。</text>
  <text x="514.0" y="178.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">60 → |60 − 100| = 40</text>
  <text x="500.0" y="224.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">危险的地方不是 60 Hz 丢了，</text>
  <text x="500.0" y="242.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而是它伪装成了 40 Hz ——</text>
  <text x="500.0" y="258.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一个看起来完全正常的频率。</text>
  <text x="500.0" y="282.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">齿轮啮合、电机换向、碰撞，</text>
  <text x="500.0" y="298.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">大量能量就在 60–90 Hz。</text>
  <text x="500.0" y="322.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">记录用 1 kHz，才能保住</text>
  <text x="500.0" y="338.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">这一段的细节。</text>
</svg>
