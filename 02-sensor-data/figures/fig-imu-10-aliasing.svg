  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">混叠：100 Hz 采样下，40 Hz 和 60 Hz 是同一组数字</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两条余弦曲线看起来完全不同，但只在每 10 ms 取一个点时，采样值一模一样。</text>
