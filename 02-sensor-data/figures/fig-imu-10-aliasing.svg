  <text x="470.0" y="274.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <text x="470.0" y="292.0" font-size="8" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">毫秒</text>
