  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">采样网格是长条形的：同样 1 米，水平 29 个点、垂直 3 个点</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">16 线雷达：水平 0.2°、垂直 2.0°，差 10 倍。下面看 10 m 远的一堵墙。</text>
