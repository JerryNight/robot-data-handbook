  <text x="122.0" y="252.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两个点之间 35 cm 的起伏，</text>
  <text x="122.0" y="268.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">数据里完全不存在 —— 只能靠猜。</text>
  <text x="122.0" y="300.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">远处一辆车只有几行点：</text>
  <text x="122.0" y="316.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">看得出它多高，看不出侧面形状。</text>
  <text x="122.0" y="344.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">这不是“分辨率不够”，是采样</text>
  <text x="122.0" y="360.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">网格本身就是长条形的。</text>
  <text x="420.0" y="92.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">点间距随距离线性增长（双对数坐标）</text>
