  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">消费级晶振常见 20–100 ppm。短 episode（30 s 以内）几乎看不出来 —— 这正是“录一小段验证”发现不了它的原因。</text>
