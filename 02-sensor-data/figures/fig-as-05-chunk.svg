 402.2 150.0 L 404.4 150.0 L 406.6 150.0 L 408.8 150.0 L 411.1 150.0 L 413.3 150.0 L 415.5 150.0 L 417.7 150.0 L 419.9 150.0 L 422.2 150.0 L 424.4 150.0 L 426.6 150.0 L 428.8 150.0 L 431.1 150.0 L 433.3 150.0 L 435.5 150.0 L 437.8 150.0 L 440.0 150.0 L 440.0 130.0 L 442.2 130.0 L 444.4 130.0 L 446.7 130.0 L 448.9 130.0 L 451.1 130.0 L 453.3 130.0 L 455.6 130.0 L 457.8 130.0 L 460.0 130.0" fill="none" stroke="#3C6E9F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <line x1="104.0" y1="210.0" x2="460.0" y2="210.0" stroke="#C0392B" stroke-width="1.6" opacity="1.0" stroke-dasharray="5 4"/>
  <text x="112.0" y="227.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">chunk = 6 → 滞后 100 mm</text>
  <text x="223.2" y="288.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">L = 100 ms → 至少 3 步</text>
  <text x="112.0" y="146.0" font-size="8.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">滞后超过 100 mm</text>
  <text x="510.0" y="122.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">两条约束</text>
  <text x="510.0" y="148.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">下界：跟得上控制频率</text>
  <text x="510.0" y="167.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">chunk × 33.3 ms ≥ 推理延迟，</text>
  <text x="510.0" y="186.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">否则每个控制周期都会丢帧。</text>
  <text x="510.0" y="224.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">上界：跟得上物体</text>
  <text x="510.0" y="243.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">chunk × 33.3 ms × 0.5 m/s 就是</text>
  <text x="510.0" y="262.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">反应滞后。超过 100 mm，动态</text>
  <text x="510.0" y="281.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">任务基本就废了。</text>
  <text x="510.0" y="319.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">可行解</text>
  <text x="510.0" y="338.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">chunk 必须同时 ≥ 蓝色阶梯、</text>
  <text x="510.0" y="357.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">≤ 6。L ≤ 200 ms 时区间非空；</text>
  <text x="510.0" y="376.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">L = 300 ms 时最小 chunk 已是 9 步，</text>
  <text x="510.0" y="395.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">越过上限，动态任务无解。</text>
  <line x1="24.0" y1="392.0" x2="736.0" y2="392.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="414.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">桌面抓取因为物体多半不动，滞后不是问题，所以实践中常见 8–20 步；传送带分拣这类动态任务</text>
  <text x="24.0" y="434.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">则必须压到 6 步以内 —— 这时候推理延迟就是硬约束。chunk 是延迟的函数，不是超参。</text>
</svg>
