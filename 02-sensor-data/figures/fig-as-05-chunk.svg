  <text x="96.0" y="133.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10</text>
  <text x="468.0" y="133.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">167 mm</text>
  <line x1="104.0" y1="330.0" x2="460.0" y2="330.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="104.0" y1="126.0" x2="104.0" y2="330.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <text x="96.0" y="118.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">最小 chunk（步）</text>
  <text x="104.0" y="348.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">0</text>
  <text x="159.6" y="348.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">50</text>
  <text x="215.2" y="348.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <text x="326.5" y="348.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">200</text>
  <text x="437.8" y="348.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">300</text>
  <text x="282.0" y="366.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">推理延迟 L（ms）</text>
