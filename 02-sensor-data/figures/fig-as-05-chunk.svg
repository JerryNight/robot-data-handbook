<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="448" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">chunk 长度由推理延迟决定，又被动态跟踪卡住上限</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">控制 30 Hz（33.3 ms/步）。下界 = ⌈推理延迟 ÷ 33.3⌉；上界 = 物体以 0.5 m/s 移动时滞后不超过 100 mm。</text>
