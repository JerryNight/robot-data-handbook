  <text x="24.0" y="308.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">这 1 秒里，6 个采样点越界。看着是“检测到接触”，其实全是噪声。</text>
  <text x="24.0" y="328.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">把阈值抬到 5σ 能降到几乎为零，但那样 0.5 N 的轻接触也检不出来了 —— 灵敏度没了。</text>
  <text x="24.0" y="356.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">所以正确做法不是调阈值，是加两条规则：</text>
  <text x="24.0" y="374.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">① 滞回：进入用 0.15 N，退出用 0.10 N（蓝虚线），避免在阈值附近反复抖动</text>
  <text x="24.0" y="392.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">② 连续 N 点确认：要求连续 5 个采样点都越界，误报率从 1.3 次/秒降到 1e-11 次/秒</text>
</svg>
