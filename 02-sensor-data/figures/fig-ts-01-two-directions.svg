  <text x="24.0" y="288.0" font-size="10" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">方向 A 的连线几乎是竖直的：相机帧总能找到 5 ms 以内的关节采样。</text>
  <text x="24.0" y="306.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">方向 B 的连线明显更斜：关节采样被拉到 16 ms 外的图像上，横向跨了半条栅格。</text>
  <text x="24.0" y="324.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而且方向 B 的“猜”是没有物理意义的 —— 图像不能插值，只能取最近的那张。</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">结论：对齐只能发生在“低频信号的时间网格”上，把高频信号插值过去。反过来做等于用 30 Hz 的信息去猜 100 Hz 的时刻。</text>
