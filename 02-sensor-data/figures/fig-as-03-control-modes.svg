  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">2 连杆臂在 q=(0.60, −0.90)。末端从 (1.494, 0.358) 到 (1.504, 0.358)。四个数组在数据集里长得一模一样。</text>
