  <polygon points="84.0,380.0 89.0,382.8 89.0,377.2" fill="#2E7D5B"/>
  <text x="120.0" y="360.0" font-size="8" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">发</text>
  <text x="120.0" y="394.0" font-size="8" fill="#2E7D5B" text-anchor="start" font-weight="400" opacity="1.0">收</text>
  <text x="56.0" y="424.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">t = 2Z / c</text>
  <text x="258.0" y="94.0" font-size="11" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">双目三角测量</text>
  <text x="345.6" y="94.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">Z = fx · B / d</text>
  <text x="258.0" y="116.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">左右两个相机看同一个点，横坐标差 d。d 越大越近。</text>
  <text x="258.0" y="136.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">不需要发光，所以不怕阳光；但要“有东西可匹配”。</text>
  <text x="258.0" y="156.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="0.9">失效：白墙、纯色桌面、重复纹理、透明与镜面。</text>
  <text x="258.0" y="220.0" font-size="11" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">结构光</text>
  <text x="307.8" y="220.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">相当于给场景“打上纹理”</text>
  <text x="258.0" y="242.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">投影一个已知的散斑图案，看它落在物体上被扭曲成什么样。</text>
  <text x="258.0" y="262.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">本质是“自己造纹理”，所以对白墙有效。</text>
  <text x="258.0" y="282.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="0.9">失效：强阳光下图案看不见；两台同类设备会互相干扰。</text>
  <text x="258.0" y="346.0" font-size="11" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">飞行时间 ToF</text>
  <text x="370.8" y="346.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">Z = c · Δt / 2</text>
  <text x="258.0" y="368.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">直接给每个像素计时：光飞出去再飞回来用了多久。</text>
  <text x="258.0" y="388.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1">1 cm 的距离只对应 67 皮秒 —— 所以对计时电路要求极高。</text>
  <text x="258.0" y="408.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="0.9">失效：多路径反射（墙角、桌面）、阳光、近距离饱和。</text>
  <text x="24.0" y="456.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">选型的判断依据不是“哪个更准”，而是“你的场景里，哪一种物理前提会先失效”。</text>
</svg>