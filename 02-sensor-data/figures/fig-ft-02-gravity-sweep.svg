  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">如果你直接拿这份数据学“什么时候碰到了东西”，模型会学到“手腕朝下 = 接触、朝上 = 没接触”。</text>
  <text x="24.0" y="386.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而这个规律在真机上完全不成立 —— 它学的是姿态，不是接触。</text>
</svg>
