<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="406" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">卷帘快门：一帧不是一个时刻，而是一段时间</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">大部分相机逐行曝光、逐行读出。30 fps 下，第 1 行和第 480 行差了整整 33 毫秒。</text>
  <rect x="56.0" y="96.0" width="132.0" height="176.0" rx="3" fill="#F4F6F8" stroke="#B0B9C2" stroke-width="1.3" opacity="1.0"/>
  <line x1="56.0" y1="125.3" x2="188.0" y2="125.3" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="56.0" y1="154.7" x2="188.0" y2="154.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="56.0" y1="184.0" x2="188.0" y2="184.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="56.0" y1="213.3" x2="188.0" y2="213.3" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="56.0" y1="242.7" x2="188.0" y2="242.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <path d="M 56 96 L 188 272" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="4 3"/>
  <text x="198.0" y="102.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">第 1 行　t = 0</text>
  <text x="198.0" y="188.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">第 240 行　t = 16.7 ms</text>
  <text x="198.0" y="274.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">第 480 行　t = 33.3 ms</text>
  <line x1="56.0" y1="306.0" x2="279.0" y2="306.0" stroke="#57606A" stroke-width="1.2"/>
  <polygon points="284.0,306.0 279.0,303.2 279.0,308.8" fill="#57606A"/>
  <text x="292.0" y="310.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">时间</text>
  <line x1="56.0" y1="302.0" x2="56.0" y2="310.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <text x="56.0" y="324.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">0</text>
  <line x1="122.0" y1="302.0" x2="122.0" y2="310.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <text x="122.0" y="324.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">16.7</text>
  <line x1="188.0" y1="302.0" x2="188.0" y2="310.0" stroke="#57606A" stroke-width="1" opacity="1.0"/>
  <text x="188.0" y="324.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">33.3</text>
  <text x="122.0" y="340.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">毫秒</text>
  <line x1="410.0" y1="300.0" x2="700.0" y2="300.0" stroke="#C9B49A" stroke-width="2" opacity="1.0"/>
  <rect x="430.0" y="120.0" width="7.0" height="180.0" rx="0" fill="#B0B9C2" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="400.0" y="116.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">静止</text>
  <path d="M 560 120 L 578 300 L 571 300 L 553 120 Z" fill="#B0806A" stroke="#B0806A" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <line x1="560.0" y1="120.0" x2="560.0" y2="300.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0" stroke-dasharray="4 3"/>
  <line x1="560.0" y1="300.0" x2="578.0" y2="300.0" stroke="#C0392B" stroke-width="1.4" opacity="1.0"/>
  <line x1="560.0" y1="296.0" x2="560.0" y2="304.0" stroke="#C0392B" stroke-width="1.2" opacity="1.0"/>
  <line x1="578.0" y1="296.0" x2="578.0" y2="304.0" stroke="#C0392B" stroke-width="1.2" opacity="1.0"/>
  <text x="552.0" y="296.0" font-size="9" fill="#C0392B" text-anchor="end" font-weight="600" opacity="1.0">17.5 px</text>
  <text x="566.0" y="116.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">1 m/s 移动</text>
  <text x="470.0" y="336.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">同一根竖直的杆，静止时是直的，动起来是斜的。</text>
  <text x="470.0" y="354.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">斜多少只取决于速度和读出时间 —— 跟相机好不好无关。</text>
  <line x1="24.0" y1="372.0" x2="736.0" y2="372.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="394.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">所以“这一帧的时间戳”只能标在其中一行上；高速样本（抓取瞬间、抛接、碰撞）恰恰畸变最重。</text>
</svg>