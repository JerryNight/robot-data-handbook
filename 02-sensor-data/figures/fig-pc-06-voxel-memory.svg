  <text x="372.0" y="350.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">体素分辨率 (cm)</text>
  <text x="52.0" y="90.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">稠密内存</text>
  <path d="M 104.0 149.0 L 176.5 170.6 L 228.0 185.8 L 300.6 207.4 L 392.0 234.5 L 452.2 252.4 L 516.0 271.3 L 588.5 292.8 L 640.0 308.1" fill="none" stroke="#3C6E9F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <text x="648.0" y="311.6" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">100 m 边长</text>
