  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">体素化的内存：范围 × 分辨率，两个方向同时要命</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">高度固定 10 m、1 字节/格。两个轴都是对数。</text>
