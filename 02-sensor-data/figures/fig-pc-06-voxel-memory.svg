  <text x="96.0" y="193.3" font-size="9" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10 GB</text>
  <line x1="104.0" y1="149.0" x2="640.0" y2="149.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="96.0" y="152.5" font-size="9" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100 GB</text>
  <line x1="104.0" y1="108.3" x2="640.0" y2="108.3" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="96.0" y="111.8" font-size="9" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1 TB</text>
  <line x1="104.0" y1="316.0" x2="104.0" y2="320.0" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
  <text x="104.0" y="333.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1</text>
  <line x1="228.0" y1="316.0" x2="228.0" y2="320.0" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
  <text x="228.0" y="333.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">2</text>
  <line x1="392.0" y1="316.0" x2="392.0" y2="320.0" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
  <text x="392.0" y="333.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">5</text>
  <line x1="516.0" y1="316.0" x2="516.0" y2="320.0" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
  <text x="516.0" y="333.0" font-size="9" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">10</text>
  <line x1="640.0" y1="316.0" x2="640.0" y2="320.0" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
