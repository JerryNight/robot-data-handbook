  <text x="648.0" y="287.1" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">200 m 边长</text>
  <path d="M 104.0 99.9 L 176.5 121.5 L 228.0 136.8 L 300.6 158.3 L 392.0 185.4 L 452.2 203.3 L 516.0 222.2 L 588.5 243.7 L 640.0 259.0" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <text x="648.0" y="262.5" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">400 m 边长</text>
  <circle cx="392.0" cy="234.5" r="4.2" fill="none" stroke="#1F2328" stroke-width="1.4" opacity="1.0"/>
  <line x1="388.0" y1="236.5" x2="380.0" y2="246.5" stroke="#1F2328" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <text x="376.0" y="254.5" font-size="9.5" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">5 cm / 100 m = 800 MB</text>
  <line x1="24.0" y1="372.0" x2="736.0" y2="372.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="392.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">范围加倍，平面格数 ×4（高度也翻倍才是 ×8）；分辨率 5 cm → 2 cm，格数 ×15.6。</text>
  <text x="24.0" y="410.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">同样一帧只有 28,800 个点：稀疏存储 0.46 MB，比稠密省 1736 倍。代价是失去随机访问，卷积必须改成稀疏卷积。</text>
</svg>
