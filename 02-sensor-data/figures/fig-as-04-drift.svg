  <text x="24.0" y="404.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">绝对表示每步都被参考位置拉住，误差是一条水平线；增量表示每步噪声独立累加，方差 = n·σ²，</text>
