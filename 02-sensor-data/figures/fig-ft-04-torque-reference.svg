<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">力矩的“原点”是数据的一部分：填错 4 cm，力矩整体减半</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">τ = r × F。r 是力作用点相对你所选原点的位置 —— 换原点，力矩就变。</text>
  <line x1="150.0" y1="250.0" x2="150.0" y2="82.0" stroke="#B0B9C2" stroke-width="3" opacity="1.0"/>
  <text x="142.0" y="74.0" font-size="9" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">工具</text>
  <circle cx="150.0" cy="122.0" r="4.5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="160.0" y="126.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">重心</text>
  <circle cx="150.0" cy="250.0" r="4.5" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="160.0" y="254.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">传感器原点</text>
  <circle cx="150.0" cy="194.0" r="4.5" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="160.0" y="198.0" font-size="9" fill="#6B5B95" text-anchor="start" font-weight="600" opacity="1.0">法兰面</text>
  <line x1="134.0" y1="250.0" x2="134.0" y2="122.0" stroke="#3C6E9F" stroke-width="1.2" opacity="1.0"/>
  <text x="128.0" y="190.0" font-size="8.5" fill="#3C6E9F" text-anchor="end" font-weight="400" opacity="1.0">0.08</text>
  <line x1="228.0" y1="250.0" x2="228.0" y2="194.0" stroke="#6B5B95" stroke-width="1.2" opacity="1.0"/>
  <text x="234.0" y="226.0" font-size="8.5" fill="#6B5B95" text-anchor="start" font-weight="400" opacity="1.0">0.04</text>
  <text x="40.0" y="300.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">同一个 14.71 N 的重力，</text>
  <text x="40.0" y="318.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">相对原点力矩 1.177 N·m，</text>
  <text x="40.0" y="336.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">相对法兰面 0.589 N·m。</text>
  <text x="360.0" y="108.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">俯仰 90° 时，力矩读数随参考点变化（单位 N·m）</text>
  <line x1="360.0" y1="268.0" x2="700.0" y2="268.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="360.0" y="124.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">参考点 = 传感器原点</text>
  <rect x="360.0" y="132.0" width="285.8" height="20.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="0.85"/>
  <text x="653.8" y="147.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">1.177 N·m</text>
  <text x="360.0" y="194.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">参考点 = 法兰面</text>
  <rect x="360.0" y="202.0" width="143.0" height="20.0" rx="3" fill="#6B5B95" stroke="none" stroke-width="0" opacity="0.85"/>
  <text x="511.0" y="217.0" font-size="9" fill="#6B5B95" text-anchor="start" font-weight="600" opacity="1.0">0.589 N·m</text>
  <line x1="360.0" y1="286.0" x2="720.0" y2="286.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="360.0" y="308.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">力和力矩的量级都在正常范围内，</text>
  <text x="360.0" y="324.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">没有任何一项越界、没有任何报错。</text>
  <text x="360.0" y="348.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">它不是一个噪声，是一个比例系数。</text>
  <text x="360.0" y="366.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">这种错查起来最费时间。</text>
  <line x1="24.0" y1="372.0" x2="736.0" y2="372.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="390.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">所以“力矩是多少”这句话不完整 —— 必须说“相对哪个点”。元数据里要写清参考点，改了就换版本号。</text>
</svg>
