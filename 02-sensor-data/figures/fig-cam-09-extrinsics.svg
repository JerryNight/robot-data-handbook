<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="396" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">外参：相机装在哪，决定了标定要解什么问题</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">内参只回答“相机自己怎么看”，外参回答“相机在机器人哪儿、朝哪边”。</text>
  <text x="40.0" y="92.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">装在手上（eye-in-hand）</text>
  <rect x="40.0" y="100.0" width="330.0" height="194.0" rx="7" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1.1" opacity="1.0"/>
  <line x1="58.0" y1="274.0" x2="352.0" y2="274.0" stroke="#C9B49A" stroke-width="3" opacity="1.0"/>
  <rect x="250.0" y="244.0" width="32.0" height="30.0" rx="2" fill="#3F6E8C" stroke="none" stroke-width="0" opacity="1.0"/>
  <line x1="66.0" y1="274.0" x2="78.0" y2="196.0" stroke="#8A94A0" stroke-width="7" opacity="1.0"/>
  <circle cx="66.0" cy="274.0" r="7" fill="#DCE4EC" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <circle cx="78.0" cy="196.0" r="4.5" fill="#ffffff" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <line x1="78.0" y1="196.0" x2="200.0" y2="158.0" stroke="#8A94A0" stroke-width="7" opacity="1.0"/>
  <circle cx="200.0" cy="158.0" r="4.5" fill="#ffffff" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <line x1="200.0" y1="158.0" x2="200.0" y2="236.0" stroke="#8A94A0" stroke-width="4" opacity="1.0"/>
  <line x1="192.0" y1="236.0" x2="208.0" y2="236.0" stroke="#8A94A0" stroke-width="4" opacity="1.0"/>
  <rect x="199.0" y="136.0" width="34.0" height="20.0" rx="3" fill="#E3E0F0" stroke="#7A6A9E" stroke-width="1.3" opacity="1.0"/>
  <text x="216.0" y="150.0" font-size="9" fill="#5D4F80" text-anchor="middle" font-weight="600" opacity="1.0">相</text>
  <path d="M 216 158 L 196 274 L 300 274 Z" fill="none" stroke="#7A6A9E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="3 3"/>
  <text x="40.0" y="312.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">相机跟着手走，看到的永远是“手边”。</text>
  <text x="40.0" y="328.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">标定的是相机 ↔ 末端的关系（换手也要重标）。</text>
  <text x="400.0" y="92.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">固定在外面（eye-to-hand）</text>
  <rect x="400.0" y="100.0" width="320.0" height="194.0" rx="7" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1.1" opacity="1.0"/>
  <line x1="418.0" y1="274.0" x2="702.0" y2="274.0" stroke="#C9B49A" stroke-width="3" opacity="1.0"/>
  <rect x="556.0" y="244.0" width="32.0" height="30.0" rx="2" fill="#3F6E8C" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="425.0" y="140.0" width="34.0" height="20.0" rx="3" fill="#E3E0F0" stroke="#7A6A9E" stroke-width="1.3" opacity="1.0"/>
  <text x="442.0" y="154.0" font-size="9" fill="#5D4F80" text-anchor="middle" font-weight="600" opacity="1.0">相</text>
  <line x1="442.0" y1="160.0" x2="442.0" y2="258.0" stroke="#B0B9C2" stroke-width="3" opacity="1.0"/>
  <line x1="428.0" y1="258.0" x2="456.0" y2="258.0" stroke="#B0B9C2" stroke-width="3" opacity="1.0"/>
  <path d="M 458 156 L 520 274 L 700 274 Z" fill="none" stroke="#7A6A9E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="1.0" stroke-dasharray="3 3"/>
  <line x1="678.0" y1="274.0" x2="668.0" y2="192.0" stroke="#8A94A0" stroke-width="7" opacity="1.0"/>
  <circle cx="678.0" cy="274.0" r="7" fill="#DCE4EC" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <circle cx="668.0" cy="192.0" r="4.5" fill="#ffffff" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <line x1="668.0" y1="192.0" x2="596.0" y2="162.0" stroke="#8A94A0" stroke-width="7" opacity="1.0"/>
  <circle cx="596.0" cy="162.0" r="4.5" fill="#ffffff" stroke="#8A94A0" stroke-width="1.4" opacity="1.0"/>
  <line x1="596.0" y1="162.0" x2="588.0" y2="238.0" stroke="#8A94A0" stroke-width="4" opacity="1.0"/>
  <line x1="580.0" y1="238.0" x2="596.0" y2="238.0" stroke="#8A94A0" stroke-width="4" opacity="1.0"/>
  <text x="400.0" y="312.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">相机不动，永远看同一个工作台；代价是</text>
  <text x="400.0" y="328.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">手臂自己会挡住画面。标定的是相机 ↔ 基座。</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">不管哪种，1° 的俯仰在 1 m 处就是 17.5 mm、3 m 处 52 mm —— 而图像、深度、内部一致性检查全都正常。</text>
  <text x="24.0" y="386.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">所以外参不能只在相机里配一次，必须随数据一起存、随每次重新标定换版本。</text>
</svg>