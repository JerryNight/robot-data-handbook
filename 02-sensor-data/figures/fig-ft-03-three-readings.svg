  <line x1="470.0" y1="300.0" x2="470.0" y2="304.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="470.0" y="318.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">180</text>
