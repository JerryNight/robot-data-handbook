  <circle cx="131.2" cy="133.6" r="8.5" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="131.2" y="137.6" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" opacity="1.0">1</text>
  <circle cx="307.0" cy="267.5" r="8.5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="307.0" y="271.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" opacity="1.0">2</text>
  <circle cx="208.4" cy="215.5" r="8.5" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="208.4" y="219.5" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="700" opacity="1.0">3</text>
  <text x="486.0" y="96.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">三种读法</text>
  <line x1="486.0" y1="112.0" x2="504.0" y2="112.0" stroke="#C0392B" stroke-width="3" opacity="1.0"/>
  <text x="510.0" y="116.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">① 直接取 |Fz|</text>
  <text x="510.0" y="132.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">最常见的错</text>
  <line x1="486.0" y1="158.0" x2="504.0" y2="158.0" stroke="#C0651A" stroke-width="3" opacity="1.0"/>
  <text x="510.0" y="162.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">② |F| 减重力模长</text>
  <text x="510.0" y="178.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">看着聪明，仍然错</text>
  <line x1="486.0" y1="204.0" x2="504.0" y2="204.0" stroke="#2E7D5B" stroke-width="3" opacity="1.0"/>
  <text x="510.0" y="208.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">③ 用姿态把重力转过去</text>
  <text x="510.0" y="224.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">唯一正确的</text>
  <line x1="486.0" y1="258.0" x2="720.0" y2="258.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="486.0" y="280.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">① 从 5 涨到 19.7 N，</text>
  <text x="486.0" y="296.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">误差 +14.7 N = 整个重力。</text>
  <text x="486.0" y="318.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">② 从 −5 到 5，</text>
  <text x="486.0" y="334.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">过了 135° 变成负的接触力。</text>
  <text x="486.0" y="360.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">② 错在哪：它假设重力和接触力同向，</text>
  <text x="486.0" y="376.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">模长能直接相减。两者成直角时就崩了。</text>
</svg>
