<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">一条光线可以有多个答案：多回波让点数变多，也让结构变复杂</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">把“第几回波”当字段丢掉，树冠点和地面点就混成一片 —— 下游会把它们当成同一个表面的抖动。</text>
  <line x1="48.0" y1="302.0" x2="404.0" y2="302.0" stroke="#1F2328" stroke-width="1.6" opacity="1.0"/>
  <text x="48.0" y="318.0" font-size="9" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">地面</text>
  <rect x="48.0" y="276.0" width="22.0" height="26.0" rx="2" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <text x="59.0" y="270.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="400" opacity="1.0">雷达</text>
<ellipse cx="238" cy="270" rx="34" ry="20" fill="#EDF4EC" stroke="#9FBFA0" stroke-width="1.2"/>
  <text x="238.0" y="238.0" font-size="9.5" fill="#4F7A52" text-anchor="middle" font-weight="400" opacity="1.0">树冠</text>
  <rect x="384.0" y="178.0" width="12.0" height="124.0" rx="1" fill="#F0F2F4" stroke="#C9D0D8" stroke-width="1.2" opacity="1.0"/>
  <text x="402.0" y="190.0" font-size="9.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">墙</text>
  <line x1="70.0" y1="278.0" x2="238.0" y2="274.0" stroke="#C0651A" stroke-width="1.6" opacity="1.0"/>
  <line x1="238.0" y1="274.0" x2="384.0" y2="270.5" stroke="#C0651A" stroke-width="1.3" opacity="1.0" stroke-dasharray="4 3"/>
  <circle cx="238.0" cy="274.0" r="8.5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="238.0" y="277.5" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600" opacity="1.0">1</text>
  <circle cx="384.0" cy="270.5" r="8.5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="384.0" y="274.0" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="600" opacity="1.0">2</text>
  <text x="252.0" y="294.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">第 1 回波 6.2 m</text>
  <text x="372.0" y="258.5" font-size="9.5" fill="#C0651A" text-anchor="end" font-weight="400" opacity="1.0">第 2 回波 8.4 m</text>
  <text x="448.0" y="96.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">无效点 ≠ 假点</text>
  <rect x="448.0" y="108.0" width="288.0" height="92.0" rx="6" fill="#FAFBFC" stroke="#DFE4EA" stroke-width="1.2" opacity="1.0"/>
  <text x="460.0" y="130.0" font-size="10" fill="#8A94A0" text-anchor="start" font-weight="600" opacity="1.0">玻璃 / 镜面：整片缺失</text>
  <text x="460.0" y="152.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">光线穿过去，或镜面反射到别处，</text>
  <text x="460.0" y="170.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">那块区域一个点都没有。</text>
  <text x="460.0" y="190.0" font-size="9.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">→ 能用 mask 掉，前提是你知道它缺了</text>
  <rect x="448.0" y="212.0" width="288.0" height="92.0" rx="6" fill="#FDF7F6" stroke="#EBD6D3" stroke-width="1.2" opacity="1.0"/>
  <text x="460.0" y="234.0" font-size="10" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">雨雾：多了不存在的点</text>
  <text x="460.0" y="256.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">悬浮水滴被当成障碍物，地图里</text>
  <text x="460.0" y="274.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">多出几百个假物体。</text>
  <text x="460.0" y="294.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">→ 这不是噪声大，是观测本身错了</text>
  <line x1="24.0" y1="332.0" x2="736.0" y2="332.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="354.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">双回波模式下，一条光线返回两个距离。16 线 28,800 点/帧，若 30% 的光线有第二回波，点数变 37,440。</text>
  <text x="24.0" y="376.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">代价不只是 +30% 的数据量，而是每个点必须带“第几回波”和“是否有效”两个字段 —— 否则数据结构装不下。</text>
</svg>
