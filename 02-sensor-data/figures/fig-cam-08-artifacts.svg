<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">深度图上一定会出现的三种“假点”</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">它们不是噪声，是测量原理的必然产物。删掉会丢信息，留着会污染点云。</text>
  <rect x="40.0" y="92.0" width="400.0" height="270.0" rx="3" fill="#9C9C9C" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="60.0" y="110.0" width="130.0" height="120.0" rx="6" fill="#969696" stroke="none" stroke-width="1" opacity="1.0"/>
  <rect x="86.0" y="122.0" width="118.0" height="110.0" rx="6" fill="#A0A0A0" stroke="none" stroke-width="1" opacity="1.0"/>
  <rect x="112.0" y="134.0" width="106.0" height="100.0" rx="6" fill="#979797" stroke="none" stroke-width="1" opacity="1.0"/>
  <rect x="138.0" y="146.0" width="94.0" height="90.0" rx="6" fill="#A1A1A1" stroke="none" stroke-width="1" opacity="1.0"/>
  <rect x="40.0" y="260.0" width="400.0" height="102.0" rx="0" fill="#E6E6E6" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="40.0" y="256.0" width="400.0" height="5.0" rx="0" fill="#BFBFBF" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="240.0" y="202.0" width="62.0" height="58.0" rx="2" fill="#F4F4F4" stroke="#D0D0D0" stroke-width="1" opacity="1.0"/>
  <rect x="340.0" y="188.0" width="40.0" height="72.0" rx="2" fill="#101010" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="100.0" y="212.0" width="70.0" height="48.0" rx="2" fill="#101010" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="40.0" y="92.0" width="400.0" height="270.0" rx="3" fill="none" stroke="#B0B9C2" stroke-width="1.2" opacity="1.0"/>
  <circle cx="130.0" cy="236.0" r="9" fill="#ffffff" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/>
  <text x="130.0" y="239.5" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">1</text>
  <circle cx="370.0" cy="184.0" r="9" fill="#ffffff" stroke="#C0392B" stroke-width="1.6" opacity="1.0"/>
  <text x="370.0" y="187.5" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">1</text>
  <circle cx="290.0" cy="258.0" r="9" fill="#ffffff" stroke="#C0651A" stroke-width="1.6" opacity="1.0"/>
  <text x="290.0" y="261.5" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">2</text>
  <circle cx="100.0" cy="132.0" r="9" fill="#ffffff" stroke="#3C6E9F" stroke-width="1.6" opacity="1.0"/>
  <text x="100.0" y="135.5" font-size="9" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">3</text>
  <text x="470.0" y="104.0" font-size="11" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">1　空洞</text>
  <text x="470.0" y="122.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">没有回波，不是“很远”</text>
  <text x="470.0" y="142.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 玻璃、镜面：光被透射或反射走了。</text>
  <text x="470.0" y="159.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 黑色/深色：光被吸收掉了。</text>
  <text x="470.0" y="176.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 超出量程：太近或太远，也算不出。</text>
  <text x="470.0" y="193.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 存成 0 还是 65535？两种都有，必须查文档。</text>
  <text x="470.0" y="226.0" font-size="11" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">2　飞点</text>
  <text x="470.0" y="244.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">桌沿上那条“不存在”的斜坡</text>
  <text x="470.0" y="264.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 边缘处一个像素里同时有前景和背景。</text>
  <text x="470.0" y="281.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 匹配窗口取平均，得到一个中间值。</text>
  <text x="470.0" y="298.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 结果是：桌沿外多出一圈悬空的点。</text>
  <text x="470.0" y="315.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 处理：中值滤波 / 边缘剔除，别直接拟合平面。</text>
  <text x="470.0" y="348.0" font-size="11" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">3　等高线台阶</text>
  <text x="470.0" y="366.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">平面上出现一圈圈“梯田”</text>
  <text x="470.0" y="386.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 16-bit 毫米量化，台阶固定 1mm。</text>
  <text x="470.0" y="403.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 越平的表面，台阶越明显（梯度小）。</text>
  <text x="470.0" y="420.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 1m 处 1mm 台阶 = 法向量歪 28°。</text>
  <text x="470.0" y="437.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 处理：先平滑再求法向量，别反过来。</text>
</svg>