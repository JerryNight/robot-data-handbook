<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="344" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">同样一秒画面，体积差两个数量级</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">640×480、30 fps。横轴是对数刻度，否则短的那几条根本看不见。</text>
  <line x1="64.0" y1="82.0" x2="664.0" y2="82.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <line x1="64.0" y1="78.0" x2="64.0" y2="86.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="64.0" y="74.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">0.1</text>
  <line x1="264.0" y1="78.0" x2="264.0" y2="86.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="264.0" y="74.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">1</text>
  <line x1="464.0" y1="78.0" x2="464.0" y2="86.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="464.0" y="74.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">10</text>
  <line x1="664.0" y1="78.0" x2="664.0" y2="86.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="664.0" y="74.0" font-size="8" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">100 MB/s</text>
  <text x="64.0" y="106.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">RGB 原始（RGB888）</text>
  <rect x="64.0" y="112.0" width="488.3" height="16.0" rx="2" fill="#C0392B" stroke="none" stroke-width="0" opacity="0.8"/>
  <text x="560.3" y="124.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">27.7 MB/s</text>
  <text x="64.0" y="148.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">深度 原始（16-bit）</text>
  <rect x="64.0" y="154.0" width="453.1" height="16.0" rx="2" fill="#C0651A" stroke="none" stroke-width="0" opacity="0.8"/>
  <text x="525.1" y="166.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">18.4 MB/s</text>
  <text x="64.0" y="190.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">深度 PNG 无损</text>
  <rect x="64.0" y="196.0" width="384.6" height="16.0" rx="2" fill="#C0651A" stroke="none" stroke-width="0" opacity="0.8"/>
  <text x="456.6" y="208.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">8.4 MB/s</text>
  <text x="64.0" y="232.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">RGB 逐帧 JPEG q=90</text>
  <rect x="64.0" y="238.0" width="253.0" height="16.0" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="0.8"/>
  <text x="325.0" y="250.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">1.8 MB/s</text>
  <text x="64.0" y="274.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">RGB H.264（1.5 Mbps）</text>
  <rect x="64.0" y="280.0" width="55.8" height="16.0" rx="2" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="0.8"/>
  <text x="127.8" y="292.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="600" opacity="1.0">0.19 MB/s</text>
  <rect x="24.0" y="292.0" width="712.0" height="0.0" rx="0" fill="none" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="24.0" y="316.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">147 倍。100 小时的纯 RGB 原始数据是 10 TB，用 H.264 是 0.07 TB —— 这不是优化技巧，是能不能落地的分界线。</text>
  <text x="24.0" y="336.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">代价：有损、随机访问慢。所以主流做法是图像走视频分块、状态和动作走列式存储（Parquet）。</text>
</svg>