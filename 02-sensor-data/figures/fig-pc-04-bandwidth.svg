<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="402" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">线数买的是垂直分辨率，代价是带宽和存储</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">水平一圈 1800 点、10 fps、每点 16 字节（xyz + intensity 各 4 字节）。</text>
  <rect x="72.0" y="231.2" width="78.0" height="18.8" rx="3" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="1.0"/>
  <text x="111.0" y="205.2" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">8h 0.13 TB</text>
  <text x="111.0" y="222.2" font-size="10.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">4.6 MB/s</text>
  <text x="111.0" y="272.0" font-size="11" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">16 线</text>
  <text x="111.0" y="290.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">垂直 2.00°</text>
  <text x="111.0" y="312.0" font-size="10" fill="#C0651A" text-anchor="middle" font-weight="400" opacity="1.0">349 mm</text>
  <rect x="202.0" y="212.5" width="78.0" height="37.5" rx="3" fill="#4F82B0" stroke="#4F82B0" stroke-width="0" opacity="1.0"/>
  <text x="241.0" y="186.5" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">8h 0.27 TB</text>
  <text x="241.0" y="203.5" font-size="10.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">9.2 MB/s</text>
  <text x="241.0" y="272.0" font-size="11" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">32 线</text>
  <text x="241.0" y="290.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">垂直 0.97°</text>
  <text x="241.0" y="312.0" font-size="10" fill="#C0651A" text-anchor="middle" font-weight="400" opacity="1.0">169 mm</text>
  <rect x="332.0" y="175.0" width="78.0" height="75.0" rx="3" fill="#79A2C6" stroke="#79A2C6" stroke-width="0" opacity="1.0"/>
  <text x="371.0" y="149.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">8h 0.53 TB</text>
  <text x="371.0" y="166.0" font-size="10.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">18.4 MB/s</text>
  <text x="371.0" y="272.0" font-size="11" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">64 线</text>
  <text x="371.0" y="290.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">垂直 0.48°</text>
  <text x="371.0" y="312.0" font-size="10" fill="#C0651A" text-anchor="middle" font-weight="400" opacity="1.0">83 mm</text>
  <rect x="462.0" y="100.0" width="78.0" height="150.0" rx="3" fill="#A6C3DA" stroke="#A6C3DA" stroke-width="0" opacity="1.0"/>
  <text x="501.0" y="74.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">8h 1.06 TB</text>
  <text x="501.0" y="91.0" font-size="10.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">36.9 MB/s</text>
  <text x="501.0" y="272.0" font-size="11" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">128 线</text>
  <text x="501.0" y="290.0" font-size="9.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">垂直 0.24°</text>
  <text x="501.0" y="312.0" font-size="10" fill="#C0651A" text-anchor="middle" font-weight="400" opacity="1.0">41 mm</text>
  <line x1="56.0" y1="250.0" x2="712.0" y2="250.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <circle cx="76.0" cy="96.0" r="3" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="86.0" y="100.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">橙色 = 10 m 处的垂直点间距</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">点数和存储都是线性涨的：8 小时采集，16 线 0.14 TB，128 线 1.06 TB —— 差 8 倍。</text>
  <text x="24.0" y="388.0" font-size="9.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">但垂直点间距只从 349 mm 降到 41 mm。买之前先问：这个任务真的需要 41 mm 吗？</text>
</svg>
