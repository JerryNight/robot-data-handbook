  <rect width="760" height="386" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">耦合误差：你往 x 推，z 通道也会“感到”力</text>
  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">六个通道不是正交的，残余串扰 1–2% FSS。它在数据里看起来和真实接触一模一样。</text>
  <line x1="88.0" y1="292.0" x2="470.0" y2="292.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
