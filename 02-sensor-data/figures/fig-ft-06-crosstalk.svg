  <line x1="88.0" y1="292.0" x2="88.0" y2="296.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="310.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">0</text>
  <line x1="179.0" y1="292.0" x2="179.0" y2="296.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="179.0" y="310.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">50</text>
  <line x1="269.9" y1="292.0" x2="269.9" y2="296.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="269.9" y="310.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <line x1="360.9" y1="292.0" x2="360.9" y2="296.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="360.9" y="310.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">150</text>
  <line x1="451.8" y1="292.0" x2="451.8" y2="296.0" stroke="#B0B9C2" stroke-width="1" opacity="1.0"/>
  <text x="451.8" y="310.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">200</text>
  <text x="82.0" y="86.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">Fz 虚读 (N)</text>
  <text x="470.0" y="328.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">真实 Fx (N)</text>
  <line x1="88.0" y1="236.4" x2="470.0" y2="236.4" stroke="#C0392B" stroke-width="1.6" opacity="1.0" stroke-dasharray="5 4"/>
  <text x="466.0" y="229.4" font-size="8.5" fill="#C0392B" text-anchor="end" font-weight="400" opacity="1.0">1 N 接触判据</text>
