  <circle cx="209.9" cy="236.4" r="4.0" fill="#C0392B" stroke="#ffffff" stroke-width="1.4" opacity="1.0"/>
  <line x1="209.9" y1="235.3" x2="291.7" y2="161.4" stroke="#B9C2CB" stroke-width="1" opacity="1.0" stroke-dasharray="3 3"/>
  <text x="295.4" y="154.2" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">Fx 只有 67 N 时</text>
  <text x="295.4" y="167.6" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">虚读就到 1 N</text>
  <text x="486.0" y="96.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">串扰怎么来的</text>
  <text x="486.0" y="118.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">应变片贴的位置不完美，</text>
  <text x="486.0" y="134.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">六路桥路相互串。</text>
  <text x="486.0" y="156.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">厂家出厂标定一个 6×6 矩阵，</text>
  <text x="486.0" y="172.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">驱动里乘逆矩阵来解耦。</text>
  <text x="486.0" y="196.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">但它会随温度、老化漂。</text>
  <line x1="486.0" y1="216.0" x2="720.0" y2="216.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="486.0" y="238.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">数据平台要做的</text>
  <text x="486.0" y="258.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 记解耦矩阵版本 + 标定时间</text>
  <text x="486.0" y="274.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">· 记驱动有没有启用解耦</text>
  <text x="486.0" y="290.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">  （很多默认关闭，逆矩阵放大噪声）</text>
  <text x="486.0" y="312.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">· 只做“减重力”不够，</text>
  <text x="486.0" y="328.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">  严格做法是先解耦再补偿</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="366.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">这类误差最阴的地方：数值合理、量级合理、单位对，只有和真值比才知道错了。</text>
</svg>
