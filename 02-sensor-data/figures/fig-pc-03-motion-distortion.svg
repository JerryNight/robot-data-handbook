  <text x="44.0" y="124.0" font-size="9" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">0 ms</text>
  <text x="194.0" y="124.0" font-size="9" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100 ms</text>
  <text x="44.0" y="142.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="400" opacity="1.0">第 1 个方位角</text>
  <text x="194.0" y="142.0" font-size="9" fill="#3C6E9F" text-anchor="end" font-weight="400" opacity="1.0">第 1800 个</text>
  <text x="430.0" y="108.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">同一面平墙，四个角被拉成了螺旋</text>
  <text x="430.0" y="132.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">扫描是逐列的：方位角 0° 的点在 0 ms 采到，</text>
  <text x="430.0" y="150.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">359.8° 的点在 99.9 ms 才采到，中间隔了 100 ms。</text>
  <text x="430.0" y="168.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">但整帧只贴一个时间戳 —— 相当于把不同时刻的</text>
  <text x="430.0" y="186.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">观测硬拼成了一张“同时刻”的点云。</text>
  <text x="430.0" y="226.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">5 m 处，纯转向引起的横向错位</text>
  <text x="724.0" y="226.0" font-size="11" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">26 cm</text>
  <line x1="430.0" y1="233.0" x2="724.0" y2="233.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="430.0" y="256.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">5 m 处，纯前进引起的位移</text>
  <text x="724.0" y="256.0" font-size="11" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">10 cm</text>
  <line x1="430.0" y1="263.0" x2="724.0" y2="263.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="430.0" y="286.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">整帧用同一时刻补偿后的残余</text>
  <text x="724.0" y="286.0" font-size="11" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">5 cm（v·T/2）</text>
  <line x1="430.0" y1="293.0" x2="724.0" y2="293.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="430.0" y="336.0" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">关键：这不是“模糊”</text>
  <text x="430.0" y="358.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">图像的运动模糊是空间上糊掉，点还在原地；</text>
  <text x="430.0" y="376.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">点云的畸变是几何上错位 —— 点依然锐利，</text>
  <text x="430.0" y="394.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">但不在它该在的位置。所以去卷积修不了它。</text>
  <line x1="24.0" y1="404.0" x2="736.0" y2="404.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="426.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">解法只有一个：每点带自己的时间戳 + 高频位姿插值（IMU / 轮速），逐点把点“搬”回同一时刻。</text>
</svg>
