  <text x="206.0" y="312.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="400" opacity="1.0">转向 30°/s</text>
  <text x="44.0" y="88.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一帧内的时间轴</text>
  <rect x="44.0" y="96.0" width="150.0" height="14.0" rx="3" fill="#EDF4FA" stroke="#CFDDEB" stroke-width="1" opacity="1.0"/>
