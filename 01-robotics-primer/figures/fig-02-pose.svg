<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606A"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C0392B"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2E7D32"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1565C0"/>
    </marker>
  </defs>

  <line x1="100" y1="310" x2="278" y2="310" stroke="#57606A" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="100" y1="310" x2="192" y2="222" stroke="#57606A" stroke-width="1.6" marker-end="url(#ax)"/>
  <line x1="100" y1="310" x2="100" y2="177" stroke="#57606A" stroke-width="1.6" marker-end="url(#ax)"/>
  <text x="288" y="315" font-size="12" fill="#57606A">x</text>
  <text x="196" y="216" font-size="12" fill="#57606A">y</text>
  <text x="88" y="172" font-size="12" fill="#57606A">z</text>
  <circle cx="100" cy="310" r="3.5" fill="#57606A"/>

  <line x1="100" y1="310" x2="520" y2="190" stroke="#8A6D3B" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="330" y="237" text-anchor="middle" font-size="12" fill="#8A6D3B" font-weight="600">(x, y, z)</text>

  <polygon points="475,190 520,213 520,261 475,238" fill="#C2CFDD" stroke="#4A6B8A" stroke-width="1.4"/>
  <polygon points="520,213 565,190 565,238 520,261" fill="#D6DFE9" stroke="#4A6B8A" stroke-width="1.4"/>
  <polygon points="520,167 565,190 520,213 475,190" fill="#F4F7FA" stroke="#4A6B8A" stroke-width="1.4"/>

  <line x1="520" y1="190" x2="578" y2="168" stroke="#C0392B" stroke-width="2" marker-end="url(#r)"/>
  <line x1="520" y1="190" x2="578" y2="214" stroke="#2E7D32" stroke-width="2" marker-end="url(#g)"/>
  <line x1="520" y1="188" x2="520" y2="128" stroke="#1565C0" stroke-width="2" marker-end="url(#b)"/>
  <circle cx="520" cy="190" r="3.5" fill="#1F2328"/>

  <text x="608" y="120" font-size="11.5" fill="#1F2328">立方体上三根</text>
  <text x="608" y="140" font-size="11.5" fill="#1F2328">彩色箭头 = 末端</text>
  <text x="608" y="160" font-size="11.5" fill="#1F2328">自己的坐标系</text>
  <text x="608" y="188" font-size="11.5" fill="#C0392B" font-weight="600">它们的朝向</text>
  <text x="608" y="208" font-size="11.5" fill="#C0392B" font-weight="600">就是"姿态"</text>

  <line x1="40" y1="348" x2="720" y2="348" stroke="#D0D7DE" stroke-width="1"/>

  <text x="40" y="378" font-size="12.5" fill="#1F2328" font-weight="600">位置（在哪）</text>
  <text x="158" y="378" font-size="12" fill="#57606A">3 个数：沿 x、y、z 各走多远</text>
  <text x="428" y="378" font-size="12.5" fill="#1F2328" font-weight="600">姿态（朝哪）</text>
  <text x="546" y="378" font-size="12" fill="#57606A">3 个数：三个方向转多少</text>
</svg>
