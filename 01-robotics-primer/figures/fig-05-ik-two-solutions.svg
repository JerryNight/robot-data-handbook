<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="370" fill="#ffffff"/>

  <line x1="200" y1="275" x2="379.6" y2="287.6" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>
  <line x1="379.6" y1="287.6" x2="416" y2="167" stroke="#1565C0" stroke-width="6" stroke-linecap="round"/>

  <line x1="200" y1="275" x2="297.7" y2="123.7" stroke="#C0651A" stroke-width="6" stroke-linecap="round"/>
