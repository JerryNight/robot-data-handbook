  <circle cx="200" cy="275" r="8" fill="#1F2328"/>
  <circle cx="416" cy="167" r="7" fill="#C0392B" stroke="#ffffff" stroke-width="2"/>

  <text x="200" y="305" text-anchor="middle" font-size="11.5" fill="#1F2328">基座（固定点）</text>
  <text x="360" y="323" text-anchor="middle" font-size="11.5" fill="#1565C0" font-weight="600">解 1：肘朝下</text>
  <text x="286" y="107" text-anchor="middle" font-size="11.5" fill="#C0651A" font-weight="600">解 2：肘朝上</text>
  <text x="432" y="283" font-size="11.5" fill="#C0392B" font-weight="600">目标点</text>
  <text x="432" y="301" font-size="11" fill="#C0392B">(1.2, 0.6)</text>

  <line x1="500" y1="65" x2="500" y2="275" stroke="#D0D7DE" stroke-width="1"/>

  <text x="524" y="77" font-size="12.5" font-weight="600" fill="#1565C0">解 1（蓝色臂）</text>
  <text x="524" y="101" font-size="11.5" fill="#1F2328">θ₁ = −4.02°</text>
  <text x="524" y="121" font-size="11.5" fill="#1F2328">θ₂ = +77.21°</text>
  <text x="524" y="145" font-size="11" fill="#57606A">肘部落在连线下方</text>

  <text x="524" y="191" font-size="12.5" font-weight="600" fill="#C0651A">解 2（橙色臂）</text>
  <text x="524" y="215" font-size="11.5" fill="#1F2328">θ₁ = +57.15°</text>
  <text x="524" y="235" font-size="11.5" fill="#1F2328">θ₂ = −77.21°</text>
  <text x="524" y="259" font-size="11" fill="#57606A">肘部落在连线上方</text>

  <line x1="40" y1="337" x2="720" y2="337" stroke="#D0D7DE" stroke-width="1"/>
  <text x="380" y="357" text-anchor="middle" font-size="12" fill="#1F2328">两条臂的关节角差了几十度，末端却落在<tspan font-weight="600" fill="#C0392B">同一个点</tspan></text>
