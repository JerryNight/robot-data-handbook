  <circle cx="257.0" cy="363.3" r="5" fill="#3C5164" opacity="0.26" stroke="#ffffff" stroke-width="1"/>
  <text x="278.8" y="374.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0">①</text>
  <line x1="148.0" y1="330.0" x2="259.9" y2="308.1" stroke="#4A6B8A" stroke-width="7" stroke-linecap="round" opacity="0.46"/>
  <line x1="259.9" y1="308.1" x2="262.0" y2="213.1" stroke="#8FA3B8" stroke-width="6" stroke-linecap="round" opacity="0.46"/>
