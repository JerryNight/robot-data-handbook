<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="470" fill="#ffffff"/>
  <defs>
    <marker id="kb4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1565C0"/>
    </marker>
  </defs>
  <text x="30.0" y="36.0" font-size="12.5" font-weight="600" fill="#1F2328">末端锁死，肘部还能沿一条弧线滑动 —— 这就是冗余</text>
  <circle cx="148" cy="330" r="114.0" fill="none" stroke="#E4E8EC" stroke-width="1" stroke-dasharray="5 4"/>
  <polyline points="257.0 363.3 258.2 359.0 259.3 354.7 260.2 350.4 260.9 346.0 261.4 341.5 261.8 337.1 262.0 332.7 262.0 328.2 261.8 323.8 261.5 319.3 261.0 314.9 260.3 310.5 259.5 306.1 258.5 301.8 257.3 297.5 255.9 293.3 254.4 289.1 252.7 285.0 250.9 280.9 248.9 276.9 246.7 273.0 244.4 269.2 242.0 265.5 239.4 261.9 236.7 258.4 233.8 254.9 230.8 251.7 227.7 248.5 224.4 245.4 221.1 242.5 217.6 239.7 214.0 237.1 210.4 234.6 206.6 232.2 202.7 230.0 198.8 227.9 194.8 226.0 190.7 224.3 186.5 222.7 182.3 221.3" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.75"/>
  <line x1="148.0" y1="330.0" x2="257.0" y2="363.3" stroke="#4A6B8A" stroke-width="7" stroke-linecap="round" opacity="0.26"/>
