  <circle cx="148.0" cy="330.0" r="6" fill="#1F2328"/>
  <circle cx="259.9" cy="308.1" r="5" fill="#3C5164" opacity="0.46" stroke="#ffffff" stroke-width="1"/>
  <text x="282.2" y="307.7" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0">②</text>
  <line x1="148.0" y1="330.0" x2="226.5" y2="247.3" stroke="#4A6B8A" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
  <line x1="226.5" y1="247.3" x2="279.0" y2="168.2" stroke="#8FA3B8" stroke-width="6" stroke-linecap="round" opacity="0.72"/>
  <line x1="279.0" y1="168.2" x2="338.0" y2="216.1" stroke="#A9B8C6" stroke-width="5" stroke-linecap="round" opacity="0.72"/>
  <circle cx="148.0" cy="330.0" r="6" fill="#1F2328"/>
  <circle cx="226.5" cy="247.3" r="5" fill="#3C5164" opacity="0.72" stroke="#ffffff" stroke-width="1"/>
  <text x="242.2" y="234.8" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0">③</text>
  <line x1="148.0" y1="330.0" x2="182.3" y2="221.3" stroke="#4A6B8A" stroke-width="7" stroke-linecap="round" opacity="1.0"/>
  <line x1="182.3" y1="221.3" x2="269.3" y2="183.2" stroke="#8FA3B8" stroke-width="6" stroke-linecap="round" opacity="1.0"/>
  <line x1="269.3" y1="183.2" x2="338.0" y2="215.8" stroke="#A9B8C6" stroke-width="5" stroke-linecap="round" opacity="1.0"/>
  <circle cx="148.0" cy="330.0" r="6" fill="#1F2328"/>
  <circle cx="182.3" cy="221.3" r="5" fill="#3C5164" opacity="1.0" stroke="#ffffff" stroke-width="1"/>
  <text x="189.1" y="203.5" text-anchor="middle" font-size="12" font-weight="600" fill="#1565C0">④</text>
  <circle cx="338.0" cy="216.0" r="6.5" fill="#C0392B"/>
  <text x="350.0" y="220.0" font-size="10.5" font-weight="600" fill="#C0392B">末端（同一个点）</text>
  <text x="140.0" y="350.0" font-size="10.5" fill="#57606A">base</text>
  <text x="470.0" y="36.0" font-size="12.5" font-weight="600" fill="#1F2328">四个构型，同一末端</text>
  <text x="470.0" y="56.0" font-size="10.5" fill="#57606A">关节角差得极远，末端位置一模一样</text>
  <text x="472.0" y="92.0" font-size="10" font-weight="600" fill="#57606A">构型</text>
  <text x="540.0" y="92.0" text-anchor="end" font-size="10" font-weight="600" fill="#57606A">q₁</text>
  <text x="602.0" y="92.0" text-anchor="end" font-size="10" font-weight="600" fill="#57606A">q₂</text>
  <text x="664.0" y="92.0" text-anchor="end" font-size="10" font-weight="600" fill="#57606A">q₃</text>
  <line x1="470" y1="101" x2="668" y2="101" stroke="#E4E8EC" stroke-width="1"/>
  <text x="474.0" y="121.0" font-size="11" font-weight="600" fill="#1565C0">①</text>
  <text x="540.0" y="121.0" text-anchor="end" font-size="11" fill="#1F2328">-17°</text>
  <text x="602.0" y="121.0" text-anchor="end" font-size="11" fill="#1F2328">+88°</text>
  <text x="664.0" y="121.0" text-anchor="end" font-size="11" fill="#1F2328">-21°</text>
  <text x="474.0" y="145.0" font-size="11" font-weight="600" fill="#1565C0">②</text>
  <text x="540.0" y="145.0" text-anchor="end" font-size="11" fill="#1F2328">+11°</text>
  <text x="602.0" y="145.0" text-anchor="end" font-size="11" fill="#1F2328">+78°</text>
  <text x="664.0" y="145.0" text-anchor="end" font-size="11" fill="#1F2328">-91°</text>
  <text x="474.0" y="169.0" font-size="11" font-weight="600" fill="#1565C0">③</text>
  <text x="540.0" y="169.0" text-anchor="end" font-size="11" fill="#1F2328">+46°</text>
  <text x="602.0" y="169.0" text-anchor="end" font-size="11" fill="#1F2328">+10°</text>
  <text x="664.0" y="169.0" text-anchor="end" font-size="11" fill="#1F2328">-96°</text>
  <text x="474.0" y="193.0" font-size="11" font-weight="600" fill="#1565C0">④</text>
  <text x="540.0" y="193.0" text-anchor="end" font-size="11" fill="#1F2328">+72°</text>
  <text x="602.0" y="193.0" text-anchor="end" font-size="11" fill="#1F2328">-49°</text>
  <text x="664.0" y="193.0" text-anchor="end" font-size="11" fill="#1F2328">-49°</text>
  <text x="470.0" y="232.0" font-size="11.5" font-weight="600" fill="#1F2328">零空间：J · Δq = 0</text>
  <text x="470.0" y="254.0" font-size="10.5" fill="#57606A">存在一个关节变化方向，走它末端速度恰好为 0。</text>
  <text x="470.0" y="272.0" font-size="10.5" fill="#57606A">只要 J 不满秩（关节比任务维度多），这种方向就必然存在。</text>
  <text x="470.0" y="306.0" font-size="11.5" font-weight="600" fill="#1F2328">它不是“精确不动”，只是“一阶不动”</text>
  <text x="470.0" y="328.0" font-size="10.5" fill="#57606A">普通构型下沿零空间走 5°，末端才漂 0.4 mm；走 20°，漂 7 mm。</text>
  <text x="470.0" y="346.0" font-size="10.5" fill="#57606A">步长越大，二阶项越压不住 —— 所以冗余规划要用小步长、</text>
  <text x="470.0" y="364.0" font-size="10.5" fill="#57606A">或者每步都用 IK 把末端拉回目标。</text>
  <text x="30.0" y="442.0" font-size="10.8" fill="#57606A">虚线圆是“大臂长度 0.6 m”画出来的：肘只能在圆上。</text>
  <text x="30.0" y="460.0" font-size="10.8" fill="#57606A">在这段 90° 的弧上任意取一点，都能配出一组关节角，让末端正好落在红点上。</text>
</svg>
