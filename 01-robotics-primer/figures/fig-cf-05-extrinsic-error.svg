<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="384" fill="#ffffff"/>
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C0392B"/>
    </marker>
    <marker id="e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B0894C"/>
    </marker>
  </defs>

  <text x="34" y="30" font-size="12.5" font-weight="600" fill="#1F2328">外参差 2°：越远偏得越多，而且从头到尾不报错</text>

  <!-- 相机本体 -->
  <rect x="86" y="226" width="30" height="28" rx="4" fill="#FBE5D6" stroke="#C0651A" stroke-width="1.5"/>
  <rect x="114" y="234" width="9" height="12" rx="2" fill="#C0651A"/>
  <text x="100" y="278" text-anchor="middle" font-size="9.5" fill="#8A4B12">相机 / 腕部</text>

  <!-- 两条射线 -->
  <line x1="122" y1="240" x2="726" y2="240" stroke="#4A5560" stroke-width="1.8"/>
  <text x="640" y="258" font-size="10" fill="#4A5560">真实方向</text>

  <line x1="122" y1="240" x2="722" y2="134" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="432" y="122" font-size="10" fill="#C0392B">标定以为的方向（偏 2°，图中放大 5 倍）</text>

  <!-- 三条距离导引线 + 误差标注 -->
  <!-- 0.3 m -->
  <line x1="270" y1="213" x2="270" y2="240" stroke="#8A9199" stroke-width="1"/>
  <line x1="270" y1="213" x2="270" y2="240" stroke="#B0894C" stroke-width="2" marker-start="url(#e2)" marker-end="url(#e2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="10" fill="#8A4B12">10.5 mm</text>

  <!-- 0.6 m -->
  <line x1="420" y1="187" x2="420" y2="240" stroke="#8A9199" stroke-width="1"/>
  <line x1="420" y1="187" x2="420" y2="240" stroke="#B0894C" stroke-width="2" marker-start="url(#e2)" marker-end="url(#e2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="10" font-weight="600" fill="#8A4B12">21 mm</text>

  <!-- 1.2 m -->
  <line x1="720" y1="134" x2="720" y2="240" stroke="#8A9199" stroke-width="1"/>
  <line x1="720" y1="134" x2="720" y2="240" stroke="#B0894C" stroke-width="2" marker-start="url(#e2)" marker-end="url(#e2)"/>
  <text x="708" y="124" text-anchor="end" font-size="10" fill="#8A4B12">42 mm</text>

  <!-- 距离轴 -->
  <line x1="122" y1="300" x2="740" y2="300" stroke="#D5DBE0" stroke-width="1"/>
  <line x1="270" y1="296" x2="270" y2="304" stroke="#D5DBE0" stroke-width="1"/>
  <line x1="420" y1="296" x2="420" y2="304" stroke="#D5DBE0" stroke-width="1"/>
  <line x1="720" y1="296" x2="720" y2="304" stroke="#D5DBE0" stroke-width="1"/>
  <text x="270" y="318" text-anchor="middle" font-size="9.8" fill="#8A9199">0.3 m</text>
  <text x="420" y="318" text-anchor="middle" font-size="9.8" fill="#8A9199">0.6 m</text>
  <text x="720" y="318" text-anchor="middle" font-size="9.8" fill="#8A9199">1.2 m</text>
  <text x="122" y="318" font-size="9.8" fill="#8A9199">目标距相机的距离 →</text>

  <!-- 右上：经验公式 -->
  <rect x="420" y="42" width="306" height="64" rx="6" fill="#F7F9FA" stroke="#E3E7EB"/>
  <text x="434" y="62" font-size="10.8" fill="#1F2328">位置误差 ≈ 距离 × 角度（弧度）</text>
  <text x="434" y="82" font-size="10.8" fill="#8A4B12">21 mm ≈ 600 mm × 0.0349 rad</text>
  <text x="434" y="98" font-size="9.8" fill="#57606A">平移误差没有这个放大：它是个常数</text>

  <text x="34" y="352" font-size="10.5" fill="#57606A">同一个杯子，外参只偏 2°，在 0.6 m 处就错 21 mm —— 夹爪的抓取容差通常只有几毫米。</text>
  <text x="34" y="370" font-size="10.5" fill="#8A4B12">而数据里不会有任何异常：图像正常、位姿正常、时间戳正常，只是所有坐标都偏了。</text>
</svg>
