<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606A"/>
    </marker>
  </defs>

  <text x="230" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">笛卡尔空间</text>
  <line x1="90" y1="320" x2="372" y2="320" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="90" y1="320" x2="90" y2="128" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <text x="378" y="336" font-size="11.5" fill="#57606A">x</text>
  <text x="78" y="126" font-size="11.5" fill="#57606A">y</text>

  <line x1="250" y1="200" x2="350" y2="140" stroke="#1565C0" stroke-width="2.4"/>
  <circle cx="250" cy="200" r="5.5" fill="#1565C0"/>
  <circle cx="275" cy="185" r="5.5" fill="#1565C0"/>
  <circle cx="300" cy="170" r="5.5" fill="#1565C0"/>
  <circle cx="325" cy="155" r="5.5" fill="#1565C0"/>
  <circle cx="350" cy="140" r="5.5" fill="#1565C0"/>
  <text x="238" y="218" font-size="11" fill="#1565C0">起点</text>
  <text x="358" y="134" font-size="11" fill="#1565C0">终点</text>
  <text x="300" y="238" text-anchor="middle" font-size="11.5" fill="#1565C0" font-weight="600">每两点间距相同</text>

  <line x1="395" y1="72" x2="395" y2="360" stroke="#E4E8EC" stroke-width="1"/>

  <text x="570" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">关节空间</text>
  <line x1="430" y1="320" x2="702" y2="320" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="430" y1="320" x2="430" y2="128" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <text x="708" y="336" font-size="11.5" fill="#57606A">θ₁</text>
  <text x="418" y="126" font-size="11.5" fill="#57606A">θ₂</text>

  <polyline points="489,141 513,172 548,207 595,248 664,301" fill="none" stroke="#C0392B" stroke-width="2.4"/>
  <circle cx="489" cy="141" r="5.5" fill="#C0392B"/>
  <circle cx="513" cy="172" r="5.5" fill="#C0392B"/>
  <circle cx="548" cy="207" r="5.5" fill="#C0392B"/>
  <circle cx="595" cy="248" r="5.5" fill="#C0392B"/>
  <circle cx="664" cy="301" r="5.5" fill="#C0392B"/>
  <text x="477" y="132" font-size="11" fill="#C0392B" text-anchor="end">起点</text>
  <text x="676" y="296" font-size="11" fill="#C0392B">终点</text>
  <text x="600" y="180" font-size="11.5" fill="#C0392B" font-weight="600">间距越拉越开</text>

  <line x1="40" y1="370" x2="720" y2="370" stroke="#D0D7DE" stroke-width="1"/>
  <text x="380" y="392" text-anchor="middle" font-size="12" fill="#1F2328">末端匀速走直线，关节角却<tspan font-weight="600" fill="#C0392B">越转越快</tspan> —— 关节速度和加速度会失控</text>
</svg>
