<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="436" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C0392B"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4A8060"/>
    </marker>
    <marker id="az" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1565C0"/>
    </marker>
    <marker id="lw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B0894C"/>
    </marker>
  </defs>

  <!-- 地面阴影 -->
  <ellipse cx="150" cy="352" rx="96" ry="13" fill="#F0F2F4"/>

  <!-- 底座 -->
  <polygon points="175.8,321.1 227.6,350.9 124.2,350.9 72.5,321.1" fill="#DDE3E9" stroke="#8A9199" stroke-width="1.4"/>
  <polygon points="72.5,321.1 124.2,350.9 124.2,359.5 72.5,329.7" fill="#C4CCD4" stroke="#8A9199" stroke-width="1.2"/>
  <polygon points="124.2,350.9 227.6,350.9 227.6,359.5 124.2,359.5" fill="#B3BCC6" stroke="#8A9199" stroke-width="1.2"/>

  <!-- 立柱 -->
  <line x1="150" y1="336" x2="150" y2="172" stroke="#B3BCC6" stroke-width="15" stroke-linecap="round"/>
  <line x1="150" y1="336" x2="150" y2="172" stroke="#DDE3E9" stroke-width="9" stroke-linecap="round"/>

  <!-- 大臂 -->
  <line x1="150" y1="171.5" x2="280.7" y2="148.5" stroke="#9AA6B2" stroke-width="13" stroke-linecap="round"/>
  <line x1="150" y1="171.5" x2="280.7" y2="148.5" stroke="#D5DDE4" stroke-width="8" stroke-linecap="round"/>

  <!-- 关节 -->
  <circle cx="150" cy="171.5" r="10" fill="#ffffff" stroke="#4A5560" stroke-width="1.8"/>
  <circle cx="280.7" cy="148.5" r="8" fill="#ffffff" stroke="#4A5560" stroke-width="1.8"/>

  <!-- 相机 -->
  <rect x="298" y="108" width="26" height="20" rx="3" fill="#FBE5D6" stroke="#C0651A" stroke-width="1.5"/>
  <rect x="322" y="114" width="9" height="8" rx="1.5" fill="#C0651A"/>
  <circle cx="306.8" cy="120.4" r="3.2" fill="#C0651A"/>
  <line x1="280.7" y1="148.5" x2="305" y2="123" stroke="#C0651A" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- ===== 坐标系三轴 ===== -->
  <!-- base -->
  <g>
    <line x1="150" y1="336" x2="176" y2="336" stroke="#C0392B" stroke-width="1.4" marker-end="url(#ax)"/>
    <line x1="150" y1="336" x2="128" y2="323" stroke="#4A8060" stroke-width="1.4" marker-end="url(#ay)"/>
    <line x1="150" y1="336" x2="150" y2="310" stroke="#1565C0" stroke-width="1.4" marker-end="url(#az)"/>
    <circle cx="150" cy="336" r="2.8" fill="#1F2328"/>
  </g>
  <!-- shoulder：与世界轴同向，画淡一点，当参考轴用 -->
  <g opacity="0.45">
    <line x1="150" y1="171.5" x2="176" y2="171.5" stroke="#C0392B" stroke-width="1.1" marker-end="url(#ax)"/>
    <line x1="150" y1="171.5" x2="128" y2="158.5" stroke="#4A8060" stroke-width="1.1" marker-end="url(#ay)"/>
    <line x1="150" y1="171.5" x2="150" y2="145.5" stroke="#1565C0" stroke-width="1.1" marker-end="url(#az)"/>
  </g>
  <!-- upper：同原点，绕 z 转了 yaw -->
  <g>
    <line x1="150" y1="171.5" x2="173.4" y2="160" stroke="#C0392B" stroke-width="2.2" marker-end="url(#ax)"/>
    <line x1="150" y1="171.5" x2="131.2" y2="182.8" stroke="#4A8060" stroke-width="2.2" marker-end="url(#ay)"/>
    <line x1="150" y1="171.5" x2="150" y2="145.5" stroke="#1565C0" stroke-width="2.2" marker-end="url(#az)"/>
  </g>
  <!-- 偏航弧箭头 -->
  <path d="M179 170.4 A28 28 0 0 0 175.4 158.6" fill="none" stroke="#B0894C" stroke-width="1.4" marker-end="url(#lw)"/>
  <text x="178" y="190" font-size="9.8" fill="#B0894C">偏航 25°</text>

  <!-- wrist：跟着大臂转到 25°，再俯仰 -20° -->
  <g>
    <line x1="280.7" y1="148.5" x2="301.6" y2="140.2" stroke="#C0392B" stroke-width="1.8" marker-end="url(#ax)"/>
    <line x1="280.7" y1="148.5" x2="266.1" y2="159.3" stroke="#4A8060" stroke-width="1.8" marker-end="url(#ay)"/>
    <line x1="280.7" y1="148.5" x2="271.5" y2="125" stroke="#1565C0" stroke-width="1.8" marker-end="url(#az)"/>
  </g>
  <!-- camera 三轴 -->
  <g>
    <line x1="306.8" y1="120.4" x2="326" y2="113.5" stroke="#C0392B" stroke-width="1.4" marker-end="url(#ax)"/>
    <line x1="306.8" y1="120.4" x2="296" y2="129" stroke="#4A8060" stroke-width="1.4" marker-end="url(#ay)"/>
    <line x1="306.8" y1="120.4" x2="300" y2="101" stroke="#1565C0" stroke-width="1.4" marker-end="url(#az)"/>
  </g>

  <!-- ===== 节点标注 ===== -->
  <line x1="92" y1="332" x2="70" y2="344" stroke="#8A9199" stroke-width="0.9"/>
  <text x="66" y="348" text-anchor="end" font-size="11.5" font-weight="600" fill="#1F2328">base</text>

  <line x1="140" y1="164" x2="112" y2="146" stroke="#8A9199" stroke-width="0.9"/>
  <text x="108" y="143" text-anchor="end" font-size="11.5" font-weight="600" fill="#1F2328">shoulder</text>

  <text x="150" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1F2328">upper</text>
  <line x1="163" y1="134" x2="168" y2="152" stroke="#8A9199" stroke-width="0.9"/>

  <line x1="287" y1="142" x2="300" y2="166" stroke="#8A9199" stroke-width="0.9"/>
  <text x="302" y="179" font-size="11.5" font-weight="600" fill="#1F2328">wrist</text>

  <line x1="318" y1="110" x2="336" y2="96" stroke="#8A9199" stroke-width="0.9"/>
  <text x="339" y="93" font-size="11.5" font-weight="600" fill="#1F2328">camera</text>

  <!-- ===== 右侧说明 ===== -->
  <line x1="352" y1="52" x2="352" y2="330" stroke="#E3E7EB" stroke-width="1"/>

  <g font-size="11">
    <circle cx="366" cy="66" r="9" fill="#EEF1F4" stroke="#8A9199" stroke-width="1"/>
    <text x="366" y="70" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2328">1</text>
    <text x="384" y="63" font-size="12" font-weight="600" fill="#1F2328">base · 底座</text>
    <text x="384" y="80" font-size="10.8" fill="#57606A">钉死在工位上，整条链的根，也是「世界」的落脚点</text>

    <circle cx="366" cy="116" r="9" fill="#EEF1F4" stroke="#8A9199" stroke-width="1"/>
    <text x="366" y="120" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2328">2</text>
    <text x="384" y="113" font-size="12" font-weight="600" fill="#1F2328">shoulder · 肩部偏航关节</text>
    <text x="384" y="130" font-size="10.8" fill="#57606A">相对 ① 只差 0.35 m 高度，连杆不变，所以这帧是静态的</text>

    <circle cx="366" cy="166" r="9" fill="#EEF1F4" stroke="#8A9199" stroke-width="1"/>
    <text x="366" y="170" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2328">3</text>
    <text x="384" y="163" font-size="12" font-weight="600" fill="#1F2328">upper · 大臂的起点</text>
    <text x="384" y="180" font-size="10.8" fill="#57606A">和 ② 同一个原点，只差一个绕竖轴的旋转——帧不是"点"</text>

    <circle cx="366" cy="216" r="9" fill="#EEF1F4" stroke="#8A9199" stroke-width="1"/>
    <text x="366" y="220" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2328">4</text>
    <text x="384" y="213" font-size="12" font-weight="600" fill="#1F2328">wrist · 大臂末端</text>
    <text x="384" y="230" font-size="10.8" fill="#57606A">距 ③ 0.40 m，随俯仰关节摆动；相机就装在这附近</text>

    <circle cx="366" cy="266" r="9" fill="#EEF1F4" stroke="#8A9199" stroke-width="1"/>
    <text x="366" y="270" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2328">5</text>
    <text x="384" y="263" font-size="12" font-weight="600" fill="#1F2328">camera · 相机光心</text>
    <text x="384" y="280" font-size="10.8" fill="#57606A">相对 ④ 的位姿不靠机械设计，靠手眼标定量出来</text>
  </g>

  <text x="366" y="312" font-size="10.5" fill="#8A4B12">→ 5 个坐标系、4 段变换，任何一段缺失，相机里的点都换不到 base</text>

  <!-- 底部链式公式 -->
  <rect x="40" y="392" width="680" height="34" rx="6" fill="#F7F9FA" stroke="#E3E7EB"/>
  <text x="380" y="414" text-anchor="middle" font-size="11.5" fill="#1F2328">T<tspan font-size="8.5" dy="3">base←camera</tspan><tspan dy="-3" font-size="11.5"> = </tspan><tspan fill="#4A7CA8">T<tspan font-size="8.5" dy="3">base←shoulder</tspan><tspan dy="-3" font-size="11.5"> · </tspan><tspan fill="#C0392B">T<tspan font-size="8.5" dy="3">shoulder←upper</tspan><tspan dy="-3" font-size="11.5"> · </tspan><tspan fill="#C0392B">T<tspan font-size="8.5" dy="3">upper←wrist</tspan><tspan dy="-3" font-size="11.5"> · </tspan><tspan fill="#C0651A">T<tspan font-size="8.5" dy="3">wrist←camera</tspan></tspan></tspan></tspan></tspan></text>
</svg>
