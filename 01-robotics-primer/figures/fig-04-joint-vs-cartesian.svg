<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606A"/>
    </marker>
    <marker id="big" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A6D3B"/>
    </marker>
  </defs>

  <text x="165" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">关节空间（每个关节的角度）</text>
  <rect x="70" y="88" width="190" height="162" rx="4" fill="#F6F8FA" stroke="#C8D1DB" stroke-width="1.2"/>
  <line x1="70" y1="250" x2="262" y2="250" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="70" y1="250" x2="70" y2="86" stroke="#57606A" stroke-width="1.4" marker-end="url(#ax)"/>
  <text x="268" y="270" font-size="12" fill="#57606A">θ₁</text>
  <text x="58" y="82" font-size="12" fill="#57606A">θ₂</text>

  <line x1="92" y1="232" x2="238" y2="120" stroke="#1565C0" stroke-width="2.4"/>
  <circle cx="92" cy="232" r="4.5" fill="#1565C0"/>
  <circle cx="238" cy="120" r="4.5" fill="#1565C0"/>
  <text x="112" y="238" font-size="11" fill="#1565C0">起点</text>
  <text x="220" y="110" font-size="11" fill="#1565C0">终点</text>
  <text x="165" y="222" text-anchor="middle" font-size="11.5" fill="#1565C0" font-weight="600">两个关节各自匀速转</text>

  <line x1="288" y1="170" x2="336" y2="170" stroke="#8A6D3B" stroke-width="1.8" marker-end="url(#big)"/>
  <text x="312" y="156" text-anchor="middle" font-size="11" fill="#8A6D3B">同一个动作</text>
  <text x="312" y="192" text-anchor="middle" font-size="11" fill="#8A6D3B">换个说法</text>

  <text x="545" y="72" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2328">笛卡尔空间（末端在哪）</text>

  <path d="M587.5 193.7 Q565 107.4 470 100" fill="none" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="6 4"/>

  <line x1="470" y1="250" x2="555" y2="250" stroke="#4A6B8A" stroke-width="5" stroke-linecap="round"/>
  <line x1="555" y1="250" x2="587.5" y2="193.7" stroke="#4A6B8A" stroke-width="5" stroke-linecap="round"/>
  <line x1="470" y1="250" x2="470" y2="165" stroke="#8FA3B8" stroke-width="5" stroke-linecap="round"/>
  <line x1="470" y1="165" x2="470" y2="100" stroke="#8FA3B8" stroke-width="5" stroke-linecap="round"/>

  <circle cx="470" cy="250" r="6" fill="#1F2328"/>
  <circle cx="587.5" cy="193.7" r="5" fill="#1565C0"/>
  <circle cx="470" cy="100" r="5" fill="#1565C0"/>

  <text x="600" y="205" font-size="11" fill="#1565C0">起点</text>
  <text x="440" y="96" font-size="11" fill="#1565C0" text-anchor="end">终点</text>
  <text x="655" y="140" font-size="11.5" fill="#C0392B" font-weight="600">末端却走了</text>
  <text x="655" y="158" font-size="11.5" fill="#C0392B" font-weight="600">一条弯的</text>

  <line x1="40" y1="288" x2="720" y2="288" stroke="#D0D7DE" stroke-width="1"/>
  <text x="380" y="312" text-anchor="middle" font-size="12" fill="#1F2328">在两排数字上划一条<tspan font-weight="600">直线</tspan>（每个关节匀速变），末端走出来的却是一条<tspan font-weight="600" fill="#C0392B">弧线</tspan></text>
</svg>
