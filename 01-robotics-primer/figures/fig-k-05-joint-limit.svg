  <text x="426.0" y="242.0" font-size="10.5" fill="#57606A">蓝色弧 = 允许转动范围 ±17°，红色短线 = 限位这堵“墙”。</text>
  <text x="426.0" y="262.0" font-size="10.5" fill="#57606A">三个关节一起贴住墙，IK 再怎么迭代都只会在边界上打转。</text>
  <text x="30.0" y="372.0" font-size="10.8" fill="#57606A">注意：这不是“误差慢慢收敛”，而是“误差永远是 0.80 m”，迭代 300 次也一样。</text>
  <text x="30.0" y="390.0" font-size="10.8" fill="#57606A">函数照样返回一组关节角，看起来完全正常 —— 调用方必须自己检查残差。</text>
