  <text x="24.0" y="54.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">看到“不对劲”先别删：先认出它是哪一种，再决定该修数据、调参数，还是什么都别做。</text>
