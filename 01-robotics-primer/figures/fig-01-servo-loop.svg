<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606A"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="160" height="120" rx="8" fill="#DDEAF7" stroke="#4A7CA8" stroke-width="1.5"/>
  <text x="120" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">上层控制器</text>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#57606A">PC / 工控机</text>
  <text x="120" y="160" text-anchor="middle" font-size="11.5" fill="#1F2328">轨迹规划 · 逆运动学</text>
  <text x="120" y="181" text-anchor="middle" font-size="11.5" fill="#1F2328">算出"该转到多少度"</text>

  <line x1="202" y1="140" x2="270" y2="140" stroke="#57606A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="236" y="126" text-anchor="middle" font-size="11" fill="#4A7CA8" font-weight="600">目标角度 θ*</text>

  <rect x="278" y="60" width="214" height="160" rx="8" fill="#FBE5D6" stroke="#C0651A" stroke-width="1.8"/>
  <text x="385" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">伺服驱动器</text>
  <line x1="298" y1="98" x2="472" y2="98" stroke="#C0651A" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="300" y="122" font-size="11.5" fill="#1F2328">① 位置环：目标与实际差多少</text>
  <text x="300" y="146" font-size="11.5" fill="#1F2328">② 速度环：决定转多快</text>
  <text x="300" y="170" font-size="11.5" fill="#1F2328">③ 电流环：算力矩，放大输出</text>
  <text x="300" y="198" font-size="10.5" fill="#8A4B12">硬件 + 固件：每秒闭环上千次</text>

  <line x1="494" y1="140" x2="560" y2="140" stroke="#57606A" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="527" y="126" text-anchor="middle" font-size="11" fill="#4A8060" font-weight="600">电流 / PWM</text>

  <rect x="568" y="80" width="152" height="120" rx="8" fill="#DDEEDA" stroke="#4A8060" stroke-width="1.5"/>
  <text x="644" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2328">电机 + 减速器</text>
  <text x="644" y="138" text-anchor="middle" font-size="11.5" fill="#1F2328">电流变成扭矩</text>
  <text x="644" y="162" text-anchor="middle" font-size="11.5" fill="#1F2328">关节真的转起来</text>

  <path d="M644 202 L644 268 L385 268 L385 224" fill="none" stroke="#8A6D3B" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arw)"/>
  <text x="520" y="286" text-anchor="middle" font-size="11" fill="#8A6D3B">编码器：实测角度 θ，一直往回报</text>
</svg>
