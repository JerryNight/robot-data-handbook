  <text x="645.0" y="194.0" text-anchor="middle" font-size="13" font-weight="600" fill="#B0894C">+0.26</text>
  <text x="704.0" y="147.0" font-size="10.5" fill="#57606A">m / rad</text>
  <text x="704.0" y="193.0" font-size="10.5" fill="#57606A">m / rad</text>
  <rect x="418" y="257" width="4" height="34" rx="2" fill="#C0392B"/>
  <text x="432.0" y="269.0" font-size="11.5" font-weight="600" fill="#C0392B">列 1  (-0.51, +0.90)</text>
  <text x="432.0" y="287.0" font-size="10.5" fill="#57606A">长 1.03 —— 关节 1 转 1 rad/s，末端走 1.03 m/s</text>
  <rect x="418" y="309" width="4" height="34" rx="2" fill="#4A8060"/>
  <text x="432.0" y="321.0" font-size="11.5" font-weight="600" fill="#4A8060">列 2  (+0.06, +0.69)</text>
  <text x="432.0" y="339.0" font-size="10.5" fill="#57606A">长 0.69 —— 同样转速，末端只走 0.69 m/s</text>
  <rect x="418" y="361" width="4" height="34" rx="2" fill="#B0894C"/>
  <text x="432.0" y="373.0" font-size="11.5" font-weight="600" fill="#B0894C">列 3  (+0.31, +0.26)</text>
  <text x="432.0" y="391.0" font-size="10.5" fill="#57606A">长 0.40 —— 最外侧关节最“没劲”，只走 0.40 m/s</text>
  <text x="40.0" y="450.0" font-size="11" fill="#57606A">注意：三个箭头起点相同、方向不同、长度不同 —— 这正是“三个关节各自动，末端走法完全不一样”的意思。</text>
