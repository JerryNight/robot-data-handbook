  <text x="176.0" y="416.0" text-anchor="middle" font-size="11" font-weight="600" fill="#1F2328">base</text>
  <text x="420.0" y="74.0" font-size="12.5" font-weight="600" fill="#1F2328">把三列画在末端，就是左边那三个箭头</text>
  <text x="420.0" y="96.0" font-size="10.5" fill="#57606A">第 j 列 = 只有关节 j 以 1 rad/s 转、其余关节不动时，末端的速度</text>
  <text x="414.0" y="178.0" font-size="15" fill="#1F2328">J =</text>
