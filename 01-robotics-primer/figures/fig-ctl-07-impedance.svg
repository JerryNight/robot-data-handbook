  <text x="80.0" y="356.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">横轴：时间 1.7–3.3 秒　纵轴：位置 0.95–1.14 m　（1.0 是目标）</text>
  <text x="24.0" y="386.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">偏移量 = 外力 / 刚度。刚度越大，越像一堵墙；刚度越小，越像一根软弹簧。</text>
  <text x="24.0" y="406.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">接触任务里，“让多少”是可以设计的参数，而不是必须消灭的误差。</text>
