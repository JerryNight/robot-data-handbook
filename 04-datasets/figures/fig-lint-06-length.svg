  <text x="24.0" y="358.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">右边这一群挤在 0.01 附近，对应「演示结束时机器人已经停住」。截断的 5 条长度是 54–84 帧，中位是 100 —— 长度检查抓不到。</text>
  <text x="24.0" y="376.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">所以「数组变短」这件事，两个子问题要用两套证据：丢帧看间隔，截断看末帧速度。</text>
</svg>
