<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">一个场景的固定开销，等于 10,588 条 episode</text>
  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">同一根对数时间轴上：场景（小时）与 episode（秒）差四个数量级。</text>
  <line x1="210.0" y1="280.0" x2="640.0" y2="280.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="202.0" y="283.5" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10 s</text>
  <line x1="210.0" y1="239.8" x2="640.0" y2="239.8" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="202.0" y="243.3" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100 s</text>
  <line x1="210.0" y1="199.6" x2="640.0" y2="199.6" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="202.0" y="203.1" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1,000 s</text>
  <line x1="210.0" y1="159.4" x2="640.0" y2="159.4" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="202.0" y="162.9" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10,000 s</text>
  <line x1="210.0" y1="119.2" x2="640.0" y2="119.2" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="202.0" y="122.7" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100,000 s</text>
  <text x="24.0" y="132.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">一个场景的固定开销</text>
  <rect x="210.0" y="114.0" width="461.3" height="26.0" rx="3" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.35"/>
  <text x="679.3" y="132.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">635,319 s</text>
  <text x="24.0" y="148.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">≈ 22 个工作日</text>
  <text x="24.0" y="190.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">一条 episode（含复位）</text>
  <rect x="210.0" y="172.0" width="74.7" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.35"/>
  <text x="292.7" y="190.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">60 s</text>
  <text x="24.0" y="206.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">16.6 秒数据 + 43 秒复位</text>
  <text x="24.0" y="248.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">一条 episode 的数据本身</text>
  <rect x="210.0" y="230.0" width="21.1" height="26.0" rx="3" fill="#8A94A0" stroke="none" stroke-width="1.2" opacity="0.35"/>
  <text x="239.1" y="248.0" font-size="9.5" fill="#8A94A0" text-anchor="start" font-weight="600" opacity="1.0">16.6 s</text>
  <text x="24.0" y="264.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">不含任何开销</text>
  <line x1="24.0" y1="316.0" x2="736.0" y2="316.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="338.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">所以「再多采一条」几乎免费，「再开一个场景」要以天计 —— 两者差 10,588 倍。</text>
</svg>
