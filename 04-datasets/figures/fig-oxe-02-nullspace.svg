<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">同样的关节运动，11%–34% 在末端空间里完全看不见</text>
  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">平面 3R 臂（2 维任务 + 3 关节）。q̇ 沿零空间的分量让末端一动不动。</text>
  <text x="24.0" y="116.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">(0°, 60°, -30°)</text>
  <rect x="150.0" y="96.0" width="361.0" height="30.0" rx="4" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="511.0" y="96.0" width="189.0" height="30.0" rx="4" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <text x="158.0" y="116.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">看得见 66%</text>
  <text x="519.0" y="116.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">看不见 34%</text>
  <text x="24.0" y="162.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">(30°, 90°, 0°)</text>
  <rect x="150.0" y="142.0" width="408.0" height="30.0" rx="4" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="558.0" y="142.0" width="142.0" height="30.0" rx="4" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <text x="158.0" y="162.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">看得见 74%</text>
  <text x="566.0" y="162.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">看不见 26%</text>
  <text x="24.0" y="208.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">(-20°, 30°, 60°)</text>
  <rect x="150.0" y="188.0" width="487.6" height="30.0" rx="4" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="637.6" y="188.0" width="62.4" height="30.0" rx="4" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <text x="158.0" y="208.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">看得见 89%</text>
  <text x="645.6" y="208.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">看不见 11%</text>
  <text x="24.0" y="254.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">(10°, 20°, 10°)</text>
  <rect x="150.0" y="234.0" width="450.6" height="30.0" rx="4" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="600.6" y="234.0" width="99.4" height="30.0" rx="4" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <text x="158.0" y="254.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">看得见 82%</text>
  <text x="608.6" y="254.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">看不见 18%</text>
  <line x1="24.0" y1="284.0" x2="736.0" y2="284.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="306.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">比例随位形变，不是常数。肘部姿态、避障姿态、腕部绕臂轴的转角，</text>
  <text x="24.0" y="324.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">都落在这条橙色带里：它们决定成败，但在 7 维动作里没有位置。</text>
</svg>
