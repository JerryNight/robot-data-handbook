  <text x="531.8" y="222.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="600" opacity="1.0">0.84 – 1.72</text>
  <line x1="120.0" y1="250.0" x2="700.0" y2="250.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="410.0" y="292.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">两条轨迹的最大坐标差</text>
  <line x1="24.0" y1="306.0" x2="736.0" y2="306.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="326.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">三组差了两百倍：门槛 0.2 是重采最大值的 1.7 倍，只有无关最小值的 24%。</text>
