  <text x="112.0" y="124.0" font-size="9.5" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">精确复制（4 条）</text>
  <line x1="120.0" y1="120.0" x2="121.0" y2="120.0" stroke="#3C6E9F" stroke-width="6" opacity="0.35"/>
