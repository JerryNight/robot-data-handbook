  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">横轴 = 两条轨迹的最大坐标差（32 点重采样后逐点取最大）。</text>
  <line x1="120.0" y1="88.0" x2="120.0" y2="250.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
