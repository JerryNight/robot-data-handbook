  <text x="281.1" y="268.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">0.5</text>
  <line x1="442.2" y1="88.0" x2="442.2" y2="250.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
