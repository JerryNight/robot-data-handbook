  <text x="129.0" y="124.0" font-size="8.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">0.0000</text>
  <text x="112.0" y="180.0" font-size="9.5" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">重采（3 条）</text>
  <line x1="138.5" y1="176.0" x2="158.8" y2="176.0" stroke="#C0651A" stroke-width="6" opacity="0.35"/>
  <circle cx="138.5" cy="176.0" r="3.4" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="158.8" cy="176.0" r="3.4" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="148.7" y="166.0" font-size="8.5" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">0.06 – 0.12</text>
