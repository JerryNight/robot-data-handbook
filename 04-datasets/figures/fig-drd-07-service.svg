<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="336" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">售后只花 1.81% 的追加投入，决定另外 99% 能不能用</text>
  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">采集 100,800 人时 vs 两次回头修：补语言标注 + 重做标定。</text>
  <rect x="40.0" y="96.0" width="660.0" height="34.0" rx="3" fill="#8A94A0" stroke="none" stroke-width="1.2" opacity="0.18"/>
  <text x="50.0" y="118.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">采集  100,800 人时</text>
  <rect x="40.0" y="140.0" width="11.9" height="34.0" rx="3" fill="#C0651A" stroke="none" stroke-width="1.2" opacity="0.35"/>
  <text x="59.9" y="162.0" font-size="10" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">售后 1825 人时（1.81%）</text>
  <line x1="60.0" y1="208.0" x2="700.0" y2="208.0" stroke="#E4E8EC" stroke-width="2" opacity="1.0"/>
  <circle cx="60.0" cy="208.0" r="5" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="60.0" y="194.0" font-size="9.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">采集开始</text>
  <text x="60.0" y="230.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">12 个月，18 个实验室</text>
  <circle cx="300.0" cy="208.0" r="5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="300.0" y="194.0" font-size="9.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">2024-12 补标注</text>
  <text x="300.0" y="230.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">75,000 条 × 3 句</text>
  <circle cx="560.0" cy="208.0" r="5" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="560.0" y="194.0" font-size="9.5" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">2025-04 重标定</text>
  <text x="560.0" y="230.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">36,000 条</text>
  <line x1="24.0" y1="268.0" x2="736.0" y2="268.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="290.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两件事都不是「采更多数据」，而是回头修已有数据。前提是原始数据还在：</text>
  <text x="24.0" y="308.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">丢了未去畸变的原图，重做标定这件事就永远做不了。</text>
</svg>
