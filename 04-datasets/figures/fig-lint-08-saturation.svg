  <line x1="24.0" y1="338.0" x2="736.0" y2="338.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="360.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">只看「被裁帧数」会高估严重程度，只看位移会低估「动作形状被削平」。两个数要一起看。</text>
  <text x="24.0" y="378.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">5% 的告警阈值 ≈ 峰值只超限 0.31% —— 所以饱和告警只适合当「这条要人看一眼」，不适合当自动拒绝。</text>
