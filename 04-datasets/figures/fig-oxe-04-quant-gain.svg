<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">末端 1 mm 的量化误差，在伸直位形放大 160 倍</text>
  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">放大倍数 = 1/σ_min。同一个精度设置，在不同位形下差 40 倍。</text>
  <text x="24.0" y="70.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">柱顶 = 放大倍数；柱下橙色 = 1 mm 折合成的关节角误差。</text>
  <line x1="96.0" y1="300.0" x2="700.0" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="303.5" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1×</text>
  <line x1="96.0" y1="217.6" x2="700.0" y2="217.6" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="221.1" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10×</text>
  <line x1="96.0" y1="135.3" x2="700.0" y2="135.3" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="138.8" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100×</text>
  <rect x="122.3" y="250.0" width="48.0" height="50.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="146.3" y="243.0" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">4.0×</text>
  <text x="146.3" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=90°</text>
  <text x="146.3" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">0.23°</text>
  <rect x="223.0" y="238.2" width="48.0" height="61.8" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="247.0" y="231.2" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">5.6×</text>
  <text x="247.0" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=60°</text>
  <text x="247.0" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">0.32°</text>
  <rect x="323.7" y="214.8" width="48.0" height="85.2" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="347.7" y="207.8" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">10.8×</text>
  <text x="347.7" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=30°</text>
  <text x="347.7" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">0.62°</text>
  <rect x="424.3" y="176.0" width="48.0" height="124.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="448.3" y="169.0" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">32.1×</text>
  <text x="448.3" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=10°</text>
  <text x="448.3" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">1.84°</text>
  <rect x="525.0" y="151.2" width="48.0" height="148.8" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="549.0" y="144.2" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">64.1×</text>
  <text x="549.0" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=5°</text>
  <text x="549.0" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">3.67°</text>
  <rect x="625.7" y="118.4" width="48.0" height="181.6" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="649.7" y="111.4" font-size="8.5" fill="#3C6E9F" text-anchor="middle" font-weight="600" opacity="1.0">160.2×</text>
  <text x="649.7" y="318.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">q2=2°</text>
  <text x="649.7" y="336.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">9.18°</text>
  <line x1="24.0" y1="352.0" x2="736.0" y2="352.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="372.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">「保留 3 位小数」这个决定，在伸直位形下等价于「关节角只能精确到 0.16 弧度」。</text>
</svg>
