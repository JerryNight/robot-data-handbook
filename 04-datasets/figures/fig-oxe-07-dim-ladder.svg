<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="372" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">7 维共享空间装不下所有本体：22 个里只有 9 个能进</text>
  <text x="24.0" y="52.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">超过 7 维的部分在转换时被压掉 —— 不是丢了精度，是丢了维度。</text>
  <text x="24.0" y="106.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">单臂 6 DoF + 夹爪</text>
  <rect x="200.0" y="88.0" width="161.0" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <text x="417.0" y="106.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">7 维</text>
  <text x="24.0" y="150.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">单臂 7 DoF + 夹爪</text>
  <rect x="200.0" y="132.0" width="161.0" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="363.0" y="132.0" width="21.0" height="26.0" rx="3" fill="#C0392B" stroke="none" stroke-width="1.2" opacity="0.22"/>
  <text x="390.0" y="150.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">丢 1 维</text>
  <text x="440.0" y="150.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">8 维</text>
  <text x="24.0" y="194.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">移动底盘 + 7 DoF 臂</text>
  <rect x="200.0" y="176.0" width="161.0" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="363.0" y="176.0" width="67.0" height="26.0" rx="3" fill="#C0392B" stroke="none" stroke-width="1.2" opacity="0.22"/>
  <text x="395.5" y="194.0" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">丢 3 维</text>
  <text x="486.0" y="194.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">10 维</text>
  <text x="24.0" y="238.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">双臂 6+6 + 2 夹爪</text>
  <rect x="200.0" y="220.0" width="161.0" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="363.0" y="220.0" width="159.0" height="26.0" rx="3" fill="#C0392B" stroke="none" stroke-width="1.2" opacity="0.22"/>
  <text x="441.5" y="238.0" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">丢 7 维</text>
  <text x="578.0" y="238.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">14 维</text>
  <text x="24.0" y="282.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">四足 12 关节 + 7 DoF 臂</text>
  <rect x="200.0" y="264.0" width="161.0" height="26.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="1.2" opacity="0.28"/>
  <rect x="363.0" y="264.0" width="297.0" height="26.0" rx="3" fill="#C0392B" stroke="none" stroke-width="1.2" opacity="0.22"/>
  <text x="510.5" y="282.0" font-size="9" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">丢 13 维</text>
  <text x="716.0" y="282.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">20 维</text>
  <line x1="361.0" y1="74.0" x2="361.0" y2="302.0" stroke="#C0651A" stroke-width="1.4" opacity="1.0" stroke-dasharray="4 3"/>
  <text x="361.0" y="68.0" font-size="9" fill="#C0651A" text-anchor="middle" font-weight="600" opacity="1.0">7 维 = 共享动作空间</text>
  <line x1="24.0" y1="328.0" x2="736.0" y2="328.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="350.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">双腿、底盘、四足的数据在库里，但进不了共享动作空间 —— 所以 RT-X 只用 9 个单臂本体。</text>
</svg>
