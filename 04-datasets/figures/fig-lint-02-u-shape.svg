  <text x="628.0" y="236.0" font-size="9" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">1.0×</text>
  <text x="644.0" y="236.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">不过线</text>
  <text x="536.0" y="254.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">ep_012</text>
  <text x="628.0" y="254.0" font-size="9" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">11.1×</text>
  <text x="644.0" y="254.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="400" opacity="1.0">过线</text>
  <text x="536.0" y="272.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">ep_010</text>
  <text x="628.0" y="272.0" font-size="9" fill="#C0392B" text-anchor="end" font-weight="600" opacity="1.0">1.4×</text>
  <text x="644.0" y="272.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">不过线</text>
  <line x1="24.0" y1="344.0" x2="736.0" y2="344.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="364.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">蓝线最小值在 0、两侧对称上翘，是干净的 U 形；橙线谷底在 +1，offset=0 高 11 倍，一眼看出。</text>
  <text x="24.0" y="382.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">红线谷底也在 +1，形状同样是 U，只是被压平到 1.4 倍 —— 判定线要 2 倍，于是它被判成正常。差别的唯一来源是动作速度。</text>
