  <text x="558.0" y="104.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">ep_000 无缺陷</text>
  <line x1="536.0" y1="120.0" x2="552.0" y2="120.0" stroke="#C0651A" stroke-width="2.2" opacity="1.0"/>
