  <text x="722.0" y="241.0" font-size="8.5" fill="#C0651A" text-anchor="end" font-weight="400" opacity="1.0">勉强可用</text>
  <text x="500.0" y="264.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">阳性率 99%</text>
  <text x="500.0" y="279.0" font-size="10.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">kappa -1.53</text>
  <text x="722.0" y="279.0" font-size="8.5" fill="#C0392B" text-anchor="end" font-weight="400" opacity="1.0">比瞎猜还差</text>
