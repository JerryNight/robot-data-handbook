  <text x="56.0" y="204.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">kappa</text>
  <rect x="486.0" y="104.0" width="250.0" height="210.0" rx="8" fill="#F7F9FA" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
