  <text x="500.0" y="306.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">一致率一个数都没变</text>
  <text x="24.0" y="368.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一致率只看「两人判得一样多不多」，不看「判对没判对」。数据集越好，它越没用：</text>
  <text x="24.0" y="384.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">成功率 99% 时，两个闭着眼全判「成功」的标注员也能拿到 99% 一致率。</text>
