<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">冷层月租便宜 6 倍，跑 10 个 epoch 就贵回去 9 倍</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">100 TB，跑 10 个 epoch。价格是外部输入，只看相对关系。</text>
  <line x1="96.0" y1="300.0" x2="520.0" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="90.0" y="303.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">0</text>
  <line x1="96.0" y1="255.5" x2="520.0" y2="255.5" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="90.0" y="258.5" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">5,000</text>
  <line x1="96.0" y1="210.9" x2="520.0" y2="210.9" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="90.0" y="213.9" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10,000</text>
  <line x1="96.0" y1="166.4" x2="520.0" y2="166.4" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="90.0" y="169.4" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">15,000</text>
  <line x1="96.0" y1="121.8" x2="520.0" y2="121.8" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="90.0" y="124.8" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">20,000</text>
  <text x="96.0" y="92.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">美元</text>
  <line x1="96.0" y1="300.0" x2="520.0" y2="300.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="96.0" y1="300.0" x2="96.0" y2="104.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <rect x="132.7" y="279.5" width="68.0" height="20.5" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="166.7" y="318.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="400" opacity="1.0">标准（热）</text>
  <text x="166.7" y="271.5" font-size="9.5" fill="#2E7D5B" text-anchor="middle" font-weight="600" opacity="1.0">$2,300</text>
  <rect x="274.0" y="288.9" width="68.0" height="11.1" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="274.0" y="197.6" width="68.0" height="91.2" rx="2" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="308.0" y="318.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="400" opacity="1.0">低频（温）</text>
  <text x="308.0" y="189.6" font-size="9.5" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">$11,490</text>
  <rect x="415.3" y="296.4" width="68.0" height="3.6" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="415.3" y="114.0" width="68.0" height="182.5" rx="2" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="449.3" y="318.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="400" opacity="1.0">归档（冷）</text>
  <text x="449.3" y="106.0" font-size="9.5" fill="#C0392B" text-anchor="middle" font-weight="600" opacity="1.0">$20,880</text>
  <rect x="548.0" y="104.0" width="188.0" height="96.0" rx="6" fill="#F7F9FB" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <rect x="560.0" y="118.0" width="12.0" height="10.0" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="578.0" y="127.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">存储（10 个月）</text>
  <rect x="560.0" y="140.0" width="12.0" height="10.0" rx="2" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="578.0" y="149.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">取回（10 个 epoch）</text>
  <text x="560.0" y="176.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">热层没有取回费</text>
  <text x="560.0" y="192.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">冷层每分钟延迟起步</text>
  <text x="24.0" y="340.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">热层 $2,300，温层 $11,490，冷层 $20,880。存储差价 6 倍，</text>
  <text x="24.0" y="360.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">总成本差价反过来 9 倍——因为取回成本压倒了存储差价。</text>
  <text x="24.0" y="382.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="400" opacity="1.0">所以分层按读的次数切，不按新旧切：只留证据的放冷层，它一年被读 0 次。</text>
</svg>
