  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">短哈希能截多短：8 位在 1 万条就有 1.2%，12 位够用到 10 万</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">生日悖论：n 个对象至少一对碰撞的概率 ≈ n² / (2 · 2^(4b))。纵轴对数刻度。</text>
