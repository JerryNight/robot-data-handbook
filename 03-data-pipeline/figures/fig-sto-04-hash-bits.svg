  <text x="582.0" y="152.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">10 万条</text>
  <line x1="552.0" y1="170.0" x2="574.0" y2="170.0" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/>
  <text x="582.0" y="174.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">100 万条</text>
  <text x="540.0" y="224.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">做到 &lt; 1e-6 需要：</text>
  <text x="540.0" y="244.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="600" opacity="1.0">1 万条 → 12 位（48 bit）</text>
  <text x="540.0" y="262.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">10 万条 → 14 位（56 bit）</text>
  <text x="540.0" y="280.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">100 万条 → 15 位（60 bit）</text>
  <text x="24.0" y="358.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">8 位（32 bit）在 10 万条直接 100%——必然撞。这是 git 短哈希冲突的翻版，</text>
  <text x="24.0" y="376.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">只是数据集的条目数比代码仓库大三个数量级。</text>
  <text x="24.0" y="398.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="400" opacity="1.0">所以短哈希只能当标签用，不能当身份证：清单里存 12 位给人看，全长 64 位给校验用。</text>
</svg>
