  <text x="604.0" y="142.0" font-size="10.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">kappa 0.93</text>
  <text x="604.0" y="160.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一致率 97.3%</text>
  <line x1="604.0" y1="176.0" x2="728.0" y2="176.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="604.0" y="196.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">门槛一次没报警</text>
  <text x="604.0" y="220.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">它挡得住乱判，</text>
  <text x="604.0" y="236.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">挡不住两个规范。</text>
  <text x="24.0" y="330.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">所以 kappa 是诊断工具，不是验收工具：它告诉你「有分歧」，但不告诉你是「人不行」还是「规范没写」。</text>
  <text x="24.0" y="346.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">分辨方法只有一个——看分歧样本的误差分布：全部落在 1.5~2.0 cm 这条窄带上，就是规范问题。</text>
