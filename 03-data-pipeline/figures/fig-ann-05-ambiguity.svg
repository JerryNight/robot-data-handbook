  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">两人都严格按规范判、零失误，规范差 1.5 cm，kappa 还有 0.82</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">A 的阈值固定 1.5 cm，B 的阈值从 1.5 挪到 3.0。除了阈值，两人没有任何分歧。</text>
