  <text x="24.0" y="366.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">最小 9.95 TB（480p 30fps ×1）→ 最大 403.11 TB（1080p 60fps ×3），差 40 倍。</text>
  <text x="24.0" y="384.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">竖着比是格式（同一条柱子的橙 vs 蓝，69 倍）；横着比是采集参数（40 倍）。</text>
  <text x="24.0" y="402.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">横着那 40 倍在按下录制键之前就定了，压缩救不回来——先降分辨率，比后面所有技巧加起来都省。</text>
