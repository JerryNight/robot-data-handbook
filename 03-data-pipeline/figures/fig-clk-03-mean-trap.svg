<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="412" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">多帧平均只会缩小随机部分，不会动那个 6.8 ms</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">对 N 帧的滞后取平均。标准差按 1/√N 下降，均值一动不动 —— 这就是偏差和方差的区别。</text>
  <line x1="90.0" y1="300.0" x2="600.0" y2="300.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="82.0" y="303.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">0</text>
  <line x1="90.0" y1="249.0" x2="600.0" y2="249.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="82.0" y="252.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">2</text>
  <line x1="90.0" y1="198.0" x2="600.0" y2="198.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="82.0" y="201.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">4</text>
  <line x1="90.0" y1="147.0" x2="600.0" y2="147.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="82.0" y="150.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">6</text>
  <line x1="90.0" y1="96.0" x2="600.0" y2="96.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="82.0" y="99.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">8</text>
  <line x1="90.0" y1="300.0" x2="600.0" y2="300.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="90.0" y1="90.0" x2="90.0" y2="300.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <text x="345.0" y="336.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">平均的帧数 N（对数）</text>
  <text x="82.0" y="82.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">ms</text>
  <text x="90.0" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1</text>
  <text x="160.0" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">3</text>
  <text x="236.7" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">10</text>
  <text x="306.7" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">30</text>
  <text x="383.3" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <text x="453.3" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">300</text>
  <text x="530.0" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1000</text>
  <text x="600.0" y="319.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">3000</text>
  <line x1="90.0" y1="125.8" x2="600.0" y2="125.8" stroke="#C0392B" stroke-width="2.2" opacity="1.0"/>
  <text x="606.0" y="128.8" font-size="8.5" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">偏差 6.83</text>
  <path d="M 90.0 236.1 L 97.3 239.7 L 104.7 243.0 L 112.0 246.2 L 119.3 249.2 L 126.7 252.1 L 134.0 254.8 L 141.3 257.3 L 148.7 259.7 L 156.0 261.9 L 163.3 264.1 L 170.7 266.1 L 178.0 268.0 L 185.3 269.8 L 192.7 271.5 L 200.0 273.1 L 207.3 274.6 L 214.7 276.0 L 222.0 277.3 L 229.3 278.6 L 236.7 279.8 L 244.0 280.9 L 251.3 282.0 L 258.7 283.0 L 266.0 283.9 L 273.3 284.8 L 280.7 285.7 L 288.0 286.5 L 295.3 287.2 L 302.7 288.0 L 310.0 288.6 L 317.3 289.3 L 324.7 289.9 L 332.0 290.4 L 339.3 291.0 L 346.7 291.5 L 354.0 292.0 L 361.3 292.4 L 368.7 292.8 L 376.0 293.2 L 383.3 293.6 L 390.7 294.0 L 398.0 294.3 L 405.3 294.6 L 412.7 294.9 L 420.0 295.2 L 427.3 295.5 L 434.7 295.7 L 442.0 296.0 L 449.3 296.2 L 456.7 296.4 L 464.0 296.6 L 471.3 296.8 L 478.7 297.0 L 486.0 297.1 L 493.4 297.3 L 500.7 297.5 L 508.0 297.6 L 515.4 297.7 L 522.7 297.9 L 530.0 298.0 L 537.4 298.1 L 544.7 298.2 L 552.0 298.3 L 559.4 298.4 L 566.7 298.5 L 574.0 298.6 L 581.4 298.6 L 588.7 298.7 L 596.0 298.8 L 603.4 298.9" fill="none" stroke="#3C6E9F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <text x="350.8" y="286.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">标准差 2.51/√N</text>
  <line x1="530.0" y1="139.3" x2="530.0" y2="288.6" stroke="#57606A" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="530.0,293.6 532.8,288.6 527.3,288.6" fill="#57606A"/>
  <text x="522.0" y="208.2" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">1000 帧平均后：</text>
  <text x="522.0" y="223.2" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">标准差 ≤0.08，偏差 6.83 不变</text>
  <line x1="24.0" y1="354.0" x2="736.0" y2="354.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="376.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">所以「校准」这件事在软件层做不到：你能测出这一批数据的平均滞后，但每台机器、每次开机都不一样。</text>
  <text x="24.0" y="396.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">唯一稳的办法是把时间戳挪到更靠近光子的一侧：曝光开始 &lt; 帧起始 SOF &lt; 收到完整帧。</text>
</svg>
