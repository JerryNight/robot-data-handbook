<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" width="760" height="486" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="486" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">一个 bag = 一张 SQLite 大表 + 一个封面</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">60 秒、3 个话题、19 800 行。图像和 IMU 挤在同一张表里，按时间交错写入。</text>
  <text x="24.0" y="84.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="600" opacity="1.0">磁盘上</text>
  <rect x="24.0" y="94.0" width="712.0" height="66.0" rx="6" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <rect x="40.0" y="104.0" width="9.0" height="8.0" rx="1" fill="#D6DDE5" stroke="#C2CBD6" stroke-width="0.8" opacity="1.0"/>
  <text x="56.0" y="113.0" font-size="10.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">my_recording/</text>
  <line x1="50.0" y1="118.0" x2="50.0" y2="152.0" stroke="#D6DDE5" stroke-width="1" opacity="1.0"/>
  <line x1="50.0" y1="130.0" x2="62.0" y2="130.0" stroke="#D6DDE5" stroke-width="1" opacity="1.0"/>
  <rect x="64.0" y="124.0" width="8.0" height="9.0" rx="1" fill="#FFFFFF" stroke="#8A94A0" stroke-width="1" opacity="1.0"/>
  <text x="78.0" y="134.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">metadata.yaml</text>
  <text x="232.0" y="134.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">3.2 KB</text>
  <text x="300.0" y="134.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">封面：声明条数、时长、每个分片 —— 但不自我校验</text>
  <line x1="50.0" y1="148.0" x2="62.0" y2="148.0" stroke="#D6DDE5" stroke-width="1" opacity="1.0"/>
  <rect x="64.0" y="142.0" width="8.0" height="9.0" rx="1" fill="#FFFFFF" stroke="#3C6E9F" stroke-width="1" opacity="1.0"/>
  <text x="78.0" y="152.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">bag_0.db3</text>
  <text x="232.0" y="152.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">65.6 MB</text>
  <text x="300.0" y="152.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">数据本体：一个标准 SQLite 数据库</text>
  <text x="24.0" y="186.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="600" opacity="1.0">db3 里</text>
  <rect x="24.0" y="196.0" width="262.0" height="108.0" rx="6" fill="#FFFFFF" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="36.0" y="214.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">topics</text>
  <text x="90.0" y="214.0" font-size="9" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">3 行</text>
  <line x1="24.0" y1="220.0" x2="286.0" y2="220.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="36.0" y="238.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">id</text>
  <text x="66.0" y="238.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">name</text>
  <text x="170.0" y="238.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">type</text>
  <text x="36.0" y="256.0" font-size="8.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">1</text>
  <text x="66.0" y="256.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">/camera/…</text>
  <text x="170.0" y="256.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">/CompressedImage</text>
  <text x="36.0" y="272.0" font-size="8.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">2</text>
  <text x="66.0" y="272.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">/joint_states</text>
  <text x="170.0" y="272.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">/JointState</text>
  <text x="36.0" y="288.0" font-size="8.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">3</text>
  <text x="66.0" y="288.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">/imu/data</text>
  <text x="170.0" y="288.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">/Imu</text>
  <rect x="302.0" y="196.0" width="434.0" height="108.0" rx="6" fill="#FFFFFF" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="314.0" y="214.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">messages</text>
  <text x="378.0" y="214.0" font-size="9" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">19 800 行，按时间写</text>
  <line x1="302.0" y1="220.0" x2="736.0" y2="220.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <rect x="314.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="331.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="348.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="365.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="382.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="399.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="416.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="433.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="450.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="467.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="0.85"/>
  <rect x="484.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="501.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="518.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="535.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="552.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="569.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="586.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="603.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="620.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <rect x="637.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <rect x="654.0" y="232.0" width="15.0" height="16.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <text x="314.0" y="268.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">每一帧 = 一行，三色 = 三个话题。没有按 topic 分区，没有二级索引。</text>
  <text x="314.0" y="288.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">想要「某话题的一段」，只能扫全表再过滤 topic_id。</text>
  <rect x="314.0" y="296.0" width="9.0" height="9.0" rx="2" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="0.85"/>
  <text x="328.0" y="304.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">图像 30 Hz</text>
  <rect x="400.0" y="296.0" width="9.0" height="9.0" rx="2" fill="#C0651A" stroke="#C0651A" stroke-width="0" opacity="0.85"/>
  <text x="414.0" y="304.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">关节 100 Hz</text>
  <rect x="486.0" y="296.0" width="9.0" height="9.0" rx="2" fill="#2E7D5B" stroke="#2E7D5B" stroke-width="0" opacity="0.85"/>
  <text x="500.0" y="304.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">IMU 200 Hz</text>
  <text x="24.0" y="336.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="600" opacity="1.0">把一行拆开来看</text>
  <rect x="24.0" y="346.0" width="712.0" height="84.0" rx="6" fill="#FCFDFE" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <rect x="28.0" y="356.0" width="54.0" height="30.0" rx="4" fill="#EAF1F7" stroke="#C8D6E2" stroke-width="1" opacity="1.0"/>
  <text x="55.0" y="370.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">id</text>
  <text x="55.0" y="382.0" font-size="7.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">int</text>
  <rect x="90.0" y="356.0" width="54.0" height="30.0" rx="4" fill="#EAF1F7" stroke="#C8D6E2" stroke-width="1" opacity="1.0"/>
  <text x="117.0" y="370.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">topic_id</text>
  <text x="117.0" y="382.0" font-size="7.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">int</text>
  <rect x="152.0" y="356.0" width="160.0" height="30.0" rx="4" fill="#EAF1F7" stroke="#C8D6E2" stroke-width="1" opacity="1.0"/>
  <text x="232.0" y="370.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">timestamp</text>
  <text x="232.0" y="382.0" font-size="7.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">int64 纳秒</text>
  <rect x="320.0" y="356.0" width="412.0" height="30.0" rx="4" fill="#DCE9F4" stroke="#C8D6E2" stroke-width="1" opacity="1.0"/>
  <text x="526.0" y="370.0" font-size="9" fill="#1F2328" text-anchor="middle" font-weight="600" opacity="1.0">data</text>
  <text x="526.0" y="382.0" font-size="7.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">BLOB</text>
  <line x1="430.0" y1="388.0" x2="430.0" y2="399.0" stroke="#57606A" stroke-width="1.2"/>
  <polygon points="430.0,404.0 432.8,399.0 427.2,399.0" fill="#57606A"/>
  <text x="440.0" y="402.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">data 里是 CDR 序列化后的字节：4 B 头 + 21 个 float64</text>
  <text x="24.0" y="418.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">分辨率、编码、关节数都不在列里 —— 它们只存在于字节内部，要先有 .msg 定义才能解。</text>
  <line x1="24.0" y1="432.0" x2="736.0" y2="432.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="452.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">这就是为什么「读一帧」在 rosbag2 里不是一次列读取，而是一次「整行取出 + 按协议反序列化」。</text>
  <text x="24.0" y="472.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">采集侧这样设计是对的（写入要快、要 append-only），但它同时决定了后面每一次查询的代价。</text>
</svg>
