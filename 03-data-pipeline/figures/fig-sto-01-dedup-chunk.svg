  <text x="308.0" y="318.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">64 KB</text>
  <line x1="414.0" y1="300.0" x2="414.0" y2="305.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="414.0" y="318.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">256 KB</text>
