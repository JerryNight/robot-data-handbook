  <text x="578.0" y="126.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">静止帧 0%</text>
  <line x1="552.0" y1="142.0" x2="574.0" y2="142.0" stroke="#3C6E9F" stroke-width="2.2" opacity="1.0"/>
  <circle cx="563.0" cy="142.0" r="3.2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="578.0" y="146.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">静止帧 20%</text>
  <line x1="552.0" y1="162.0" x2="574.0" y2="162.0" stroke="#C0651A" stroke-width="2.2" opacity="1.0"/>
