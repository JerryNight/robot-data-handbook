  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">块大小决定去重能抓到多少：块一接近静止段长度就归零</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">12 个 episode × 60 帧，静止帧连续成段、起点随机。横轴对数刻度。</text>
