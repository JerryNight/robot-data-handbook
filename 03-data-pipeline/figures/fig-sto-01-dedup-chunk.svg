  <text x="578.0" y="166.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">静止帧 40%</text>
  <line x1="552.0" y1="182.0" x2="574.0" y2="182.0" stroke="#6B5B95" stroke-width="2.2" opacity="1.0"/>
  <circle cx="563.0" cy="182.0" r="3.2" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="578.0" y="186.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">静止帧 60%</text>
  <text x="540.0" y="226.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">40% 静止帧时：</text>
  <text x="540.0" y="244.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">4 KB 省 30%</text>
  <text x="540.0" y="262.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">16 KB 省 20%</text>
  <text x="540.0" y="280.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">64 KB 省 0%</text>
  <text x="24.0" y="348.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">静止段只有几十 KB。块一旦接近这个长度，整块里只要有一帧在动就独一无二，</text>
  <text x="24.0" y="366.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">那些静止帧一个都抓不到——这就是「我们的数据重复很多，去重一定有效」的漏洞。</text>
  <text x="24.0" y="390.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">粗线在 0% 处重叠：256 KB 和 1 MB 的所有档位都省 0%。</text>
