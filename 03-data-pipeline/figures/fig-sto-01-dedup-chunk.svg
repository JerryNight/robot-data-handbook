  <text x="96.0" y="88.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">去重省下的字节（%）</text>
  <line x1="96.0" y1="300.0" x2="520.0" y2="300.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="96.0" y1="300.0" x2="96.0" y2="100.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
