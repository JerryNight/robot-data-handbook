  <text x="24.0" y="358.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">两件事必须分开问：</text>
  <text x="24.0" y="380.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">50 mm 那一档的谷深 0.249 px 大于噪声本底，所以 20% 的焦距错误确实能被抓出来；</text>
  <text x="24.0" y="400.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">但同一条的 σ_f 是 9.8 px（1.6%），估计值只能信到这个精度——检出和估准不是同一件事。</text>
  <text x="24.0" y="420.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">判据是 L/d 而不是 L：放大倍数约 (d+L)/L，从 21 降到 4.3，300 mm 的经验值就是这么来的。</text>
