  <rect x="512.0" y="312.0" width="52.5" height="10.0" rx="3" fill="#2E7D5B" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <text x="24.0" y="344.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">力/接触信号自动切分</text>
  <text x="320.0" y="344.0" font-size="9.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">30 ms</text>
  <text x="430.0" y="344.0" font-size="9.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">3 帧</text>
  <text x="500.0" y="344.0" font-size="9.5" fill="#2E7D5B" text-anchor="end" font-weight="600" opacity="1.0">1%</text>
  <rect x="512.0" y="336.0" width="19.7" height="10.0" rx="3" fill="#2E7D5B" stroke="none" stroke-width="1.2" opacity="0.3"/>
  <line x1="24.0" y1="368.0" x2="736.0" y2="368.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="388.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">人的反应时间下限决定这条路走不通：不是标注员不认真，是 300 ms 就是人的常态。</text>
