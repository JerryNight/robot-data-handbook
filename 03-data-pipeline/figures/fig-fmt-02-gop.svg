  <line x1="437.2" y1="300.0" x2="437.2" y2="305.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="437.2" y="318.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">60</text>
  <line x1="496.0" y1="300.0" x2="496.0" y2="305.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="496.0" y="318.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">120</text>
