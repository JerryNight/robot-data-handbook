  <text x="293.0" y="336.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">GOP（帧）</text>
  <text x="90.0" y="84.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">字节（MB，对数轴）</text>
  <line x1="90.0" y1="208.5" x2="496.0" y2="208.5" stroke="#8A94A0" stroke-width="1" opacity="1.0" stroke-dasharray="4 3"/>
  <text x="96.0" y="229.5" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">你真正要的：0.9 MB</text>
  <line x1="378.4" y1="96.0" x2="378.4" y2="300.0" stroke="#6B5B95" stroke-width="1" opacity="0.7" stroke-dasharray="3 3"/>
