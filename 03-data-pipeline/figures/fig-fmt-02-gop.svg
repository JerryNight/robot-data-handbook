  <text x="492.0" y="107.3" font-size="9" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">必须解码的像素</text>
  <text x="492.0" y="187.3" font-size="9" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">实际读盘</text>
  <rect x="524.0" y="96.0" width="212.0" height="128.0" rx="6" fill="#F7F9FB" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="538.0" y="118.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">GOP=30 时取第 137 帧</text>
  <text x="538.0" y="142.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">读盘（压缩字节）</text>
  <text x="722.0" y="142.0" font-size="9" fill="#C0651A" text-anchor="end" font-weight="600" opacity="1.0">0.40 MB</text>
  <text x="538.0" y="162.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">解码（像素）</text>
  <text x="722.0" y="162.0" font-size="9" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">27.6 MB</text>
  <text x="538.0" y="182.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">真正需要</text>
  <text x="722.0" y="182.0" font-size="9" fill="#2E7D5B" text-anchor="end" font-weight="600" opacity="1.0">0.90 MB</text>
  <text x="538.0" y="212.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">为了 0.9 MB 的像素，多付 30 倍</text>
  <text x="524.0" y="250.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两条线的间距恒为 69 倍，就是压缩比——</text>
  <text x="524.0" y="267.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">它不随 GOP 变。随 GOP 增长的是每次访问的</text>
  <text x="524.0" y="284.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">绝对浪费，所以视频只能顺序读。</text>
