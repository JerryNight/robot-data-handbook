  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">GOP 越长，随机取一帧要搬的字节越多：体积换粒度</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">H.264 CRF23，单帧压缩后 13 KB、解压后 900 KB。两条线都是对数刻度，全量 100,000 帧。</text>
  <line x1="90.0" y1="295.7" x2="496.0" y2="295.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
