<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="344" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">同一个数据集，只差一个 chunk 参数，随机访问差 100 倍</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">1,000 个 episode × 100 帧 640×480 RGB。横轴是「抽一帧实际读了多少字节」，对数刻度。</text>
  <line x1="217.6" y1="96.0" x2="217.6" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="217.6" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">0.5</text>
  <line x1="241.5" y1="96.0" x2="241.5" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="241.5" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1</text>
  <line x1="296.9" y1="96.0" x2="296.9" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="296.9" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">5</text>
  <line x1="320.8" y1="96.0" x2="320.8" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="320.8" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">10</text>
  <line x1="376.2" y1="96.0" x2="376.2" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="376.2" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">50</text>
  <line x1="400.1" y1="96.0" x2="400.1" y2="296.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="400.1" y="313.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">100</text>
  <line x1="200.0" y1="296.0" x2="424.0" y2="296.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="200.0" y1="296.0" x2="200.0" y2="96.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <text x="424.0" y="330.0" font-size="9" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">抽一帧读盘（MB，对数轴）</text>
  <text x="192.0" y="119.5" font-size="9.2" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">A 定长记录 + 可 seek</text>
  <rect x="200.0" y="107.0" width="38.7" height="18.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="244.7" y="119.5" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">0.92 MB</text>
  <text x="192.0" y="159.5" font-size="9.2" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">B chunk=100 帧</text>
  <rect x="200.0" y="147.0" width="197.3" height="18.0" rx="3" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="391.3" y="159.5" font-size="9" fill="#ffffff" text-anchor="end" font-weight="400" opacity="1.0">92.16 MB</text>
  <text x="192.0" y="199.5" font-size="9.2" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">C chunk=1 帧</text>
  <rect x="200.0" y="187.0" width="38.7" height="18.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="244.7" y="199.5" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">0.92 MB</text>
  <text x="192.0" y="239.5" font-size="9.2" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">D 每帧一个文件</text>
  <rect x="200.0" y="227.0" width="38.7" height="18.0" rx="3" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="244.7" y="239.5" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">0.92 MB</text>
  <text x="192.0" y="279.5" font-size="9.2" fill="#1F2328" text-anchor="end" font-weight="400" opacity="1.0">E 视频 GOP=30</text>
  <rect x="200.0" y="267.0" width="10.2" height="18.0" rx="3" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="216.2" y="279.5" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">0.40 MB</text>
  <text x="470.0" y="120.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">换成 dataloader 的取法：一个 batch 64 个样本</text>
  <text x="470.0" y="148.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">B chunk=100 帧</text>
  <rect x="470.0" y="154.0" width="240.0" height="14.0" rx="3" fill="#C0392B" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="704.0" y="165.0" font-size="9" fill="#ffffff" text-anchor="end" font-weight="600" opacity="1.0">5.90 GB</text>
  <text x="470.0" y="192.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">C chunk=1 帧</text>
  <rect x="470.0" y="198.0" width="2.4" height="14.0" rx="2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="480.0" y="209.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">59 MB（这条只有 2 像素宽）</text>
  <text x="600.0" y="188.0" font-size="15" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">×100</text>
  <text x="470.0" y="240.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两者的压缩率完全相同——都是无压缩原始字节，</text>
  <text x="470.0" y="257.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">一个字节都没省。差的只是最小读单位：100 帧 vs 1 帧。</text>
  <text x="470.0" y="282.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="400" opacity="1.0">A 和 C 一样快，所以「文件太大」不是问题，「块太大」才是。</text>
</svg>
