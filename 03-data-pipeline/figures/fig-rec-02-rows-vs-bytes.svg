<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">图像只占 9.1% 的条数，却占 95.9% 的字节</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">同一段 60 秒录制：19 800 条消息，63.7 MB。这两个占比决定了后面所有成本讨论都围绕图像。</text>
  <text x="24.0" y="84.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">消息条数</text>
  <rect x="24.0" y="94.0" width="488.0" height="26.0" rx="4" fill="#EDF1F5" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="24.0" y="94.0" width="44.4" height="26.0" rx="4" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="0.85"/>
  <text x="76.4" y="111.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">9.1%</text>
  <text x="24.0" y="140.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">1 800 / 19 800</text>
  <text x="24.0" y="164.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">字节数</text>
  <rect x="24.0" y="174.0" width="488.0" height="26.0" rx="4" fill="#EDF1F5" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="24.0" y="174.0" width="468.0" height="26.0" rx="4" fill="#3C6E9F" stroke="#3C6E9F" stroke-width="0" opacity="0.85"/>
  <text x="500.0" y="191.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">95.9%</text>
  <text x="24.0" y="220.0" font-size="8.5" fill="#8A94A0" text-anchor="start" font-weight="400" opacity="1.0">61.1 MB / 63.7 MB</text>
  <text x="548.0" y="86.0" font-size="9.5" fill="#57606A" text-anchor="start" font-weight="600" opacity="1.0">每帧平均字节</text>
  <rect x="548.0" y="104.0" width="188.0" height="44.0" rx="5" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="548.0" y1="104.0" x2="548.0" y2="148.0" stroke="#3C6E9F" stroke-width="3" opacity="1.0"/>
  <text x="560.0" y="122.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">图像帧</text>
  <text x="730.0" y="122.0" font-size="10.5" fill="#1F2328" text-anchor="end" font-weight="600" opacity="1.0">33.1 KB</text>
  <text x="730.0" y="138.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1×</text>
  <rect x="548.0" y="160.0" width="188.0" height="44.0" rx="5" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="548.0" y1="160.0" x2="548.0" y2="204.0" stroke="#C0651A" stroke-width="3" opacity="1.0"/>
  <text x="560.0" y="178.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">关节状态</text>
  <text x="730.0" y="178.0" font-size="10.5" fill="#1F2328" text-anchor="end" font-weight="600" opacity="1.0">172 B</text>
  <text x="730.0" y="194.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1/197</text>
  <rect x="548.0" y="216.0" width="188.0" height="44.0" rx="5" fill="#FAFBFC" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="548.0" y1="216.0" x2="548.0" y2="260.0" stroke="#2E7D5B" stroke-width="3" opacity="1.0"/>
  <text x="560.0" y="234.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">IMU</text>
  <text x="730.0" y="234.0" font-size="10.5" fill="#1F2328" text-anchor="end" font-weight="600" opacity="1.0">132 B</text>
  <text x="730.0" y="250.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1/257</text>
  <line x1="24.0" y1="268.0" x2="512.0" y2="268.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="290.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">一张图 33.1 KB，一条关节状态 172 字节 —— 差 197 倍。</text>
  <text x="24.0" y="310.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">所以「10 分钟数据」的 96% 是视频，成本模型必须以图像为基准：</text>
  <text x="24.0" y="330.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">存储、带宽、转码时间、甚至去重的收益，全部由图像主导。</text>
  <line x1="24.0" y1="348.0" x2="736.0" y2="348.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="370.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">反过来也成立：如果只算「有多少帧可以用来训练」，图像反而是最稀疏的那个 —— 30 Hz，</text>
  <text x="24.0" y="390.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">而关节有 100 Hz、IMU 有 200 Hz。按条数估工作量会低估 10 倍，按字节估会高估。</text>
</svg>
