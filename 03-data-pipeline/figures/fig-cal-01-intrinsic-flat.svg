  <text x="327.0" y="196.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">双视图：只有 600 附近压不下去</text>
  <circle cx="319.0" cy="284.1" r="3.6" fill="#C0651A" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="584.0" y="92.0" width="152.0" height="96.0" rx="6" fill="#F7F9FB" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="596.0" y1="114.0" x2="618.0" y2="114.0" stroke="#3C6E9F" stroke-width="2.4" opacity="1.0"/>
  <text x="626.0" y="118.0" font-size="9.5" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">只有一张图</text>
  <line x1="596.0" y1="140.0" x2="618.0" y2="140.0" stroke="#C0651A" stroke-width="2.4" opacity="1.0"/>
  <text x="626.0" y="144.0" font-size="9.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">多走 300 mm</text>
  <text x="596.0" y="168.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两条线用同一份数据</text>
  <text x="596.0" y="181.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">只差第二张图</text>
  <line x1="24.0" y1="348.0" x2="736.0" y2="348.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="370.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">蓝线为什么是平的：</text>
  <text x="24.0" y="392.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">u ≈ (f/d)·x，只有比值进得了图像。焦距取 480 就配 d=0.80 m，取 750 就配 d=1.25 m——</text>
  <text x="24.0" y="412.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两种参数生成完全相同的像素，残差当然一样。所谓「标定成功」只证明了这条曲线存在。</text>
  <text x="24.0" y="436.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">橙线的谷不是「优化更好」，是多了一条真约束：第二张图的距离被 300 mm 锁死了。</text>
</svg>
