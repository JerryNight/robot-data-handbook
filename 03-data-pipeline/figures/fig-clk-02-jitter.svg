  <text x="24.0" y="352.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">两个毛病必须分开处理（硬件戳：均值 +0.040 ms，P99 0.09 ms）：</text>
  <text x="24.0" y="374.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">① 整条分布右移 6.8 ms —— 系统性滞后。不补偿，模型会把「观测晚于动作」当因果结构学进去。</text>
  <text x="24.0" y="396.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">② 右侧的尾巴 —— 2% 的帧被调度器卡到 10–20 ms。均值完全看不出来，但它是最难处理的离群点。</text>
