<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="428" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">40 ppm 的漂移是一条斜坡，不是噪声：8 小时就是 1.15 秒</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两个独立晶振最坏相差 40 ppm。偏差随时间线性增长，而且不会自己回来。</text>
  <line x1="96.0" y1="320.0" x2="600.0" y2="320.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="323.0" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">0.01</text>
  <line x1="96.0" y1="279.1" x2="600.0" y2="279.1" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="282.1" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">0.1</text>
  <line x1="96.0" y1="238.2" x2="600.0" y2="238.2" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="241.2" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1</text>
  <line x1="96.0" y1="197.3" x2="600.0" y2="197.3" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="200.3" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10</text>
  <line x1="96.0" y1="156.4" x2="600.0" y2="156.4" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="159.4" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">100</text>
  <line x1="96.0" y1="115.5" x2="600.0" y2="115.5" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="88.0" y="118.5" font-size="8" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1000</text>
  <line x1="96.0" y1="320.0" x2="600.0" y2="320.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="96.0" y1="90.0" x2="96.0" y2="320.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <text x="88.0" y="82.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">累计偏差（ms，对数）</text>
  <line x1="96.0" y1="320.0" x2="96.0" y2="325.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="96.0" y="339.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1 s</text>
  <line x1="297.0" y1="320.0" x2="297.0" y2="325.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="297.0" y="339.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1 min</text>
  <line x1="410.0" y1="320.0" x2="410.0" y2="325.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="410.0" y="339.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">10 min</text>
  <line x1="497.9" y1="320.0" x2="497.9" y2="325.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="497.9" y="339.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">1 h</text>
  <line x1="600.0" y1="320.0" x2="600.0" y2="325.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="600.0" y="339.0" font-size="8.5" fill="#8A94A0" text-anchor="middle" font-weight="400" opacity="1.0">8 h</text>
  <text x="348.0" y="358.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">持续时间（对数）</text>
  <path d="M 96.0 295.4 L 101.7 293.3 L 107.3 291.3 L 113.0 289.2 L 118.6 287.2 L 124.3 285.2 L 129.9 283.1 L 135.6 281.1 L 141.2 279.0 L 146.9 277.0 L 152.5 274.9 L 158.2 272.9 L 163.8 270.8 L 169.5 268.8 L 175.1 266.7 L 180.8 264.7 L 186.4 262.7 L 192.1 260.6 L 197.7 258.6 L 203.4 256.5 L 209.0 254.5 L 214.7 252.4 L 220.3 250.4 L 226.0 248.3 L 231.6 246.3 L 237.3 244.3 L 242.9 242.2 L 248.6 240.2 L 254.2 238.1 L 259.9 236.1 L 265.5 234.0 L 271.2 232.0 L 276.8 229.9 L 282.5 227.9 L 288.1 225.9 L 293.8 223.8 L 299.4 221.8 L 305.1 219.7 L 310.7 217.7 L 316.4 215.6 L 322.0 213.6 L 327.7 211.5 L 333.3 209.5 L 339.0 207.4 L 344.6 205.4 L 350.3 203.4 L 355.9 201.3 L 361.6 199.3 L 367.2 197.2 L 372.9 195.2 L 378.5 193.1 L 384.2 191.1 L 389.9 189.0 L 395.5 187.0 L 401.2 185.0 L 406.8 182.9 L 412.5 180.9 L 418.1 178.8 L 423.8 176.8 L 429.4 174.7 L 435.1 172.7 L 440.7 170.6 L 446.4 168.6 L 452.0 166.6 L 457.7 164.5 L 463.3 162.5 L 469.0 160.4 L 474.6 158.4 L 480.3 156.3 L 485.9 154.3 L 491.6 152.2 L 497.2 150.2 L 502.9 148.1 L 508.5 146.1 L 514.2 144.1 L 519.8 142.0 L 525.5 140.0 L 531.1 137.9 L 536.8 135.9 L 542.4 133.8 L 548.1 131.8 L 553.7 129.7 L 559.4 127.7 L 565.0 125.7 L 570.7 123.6 L 576.3 121.6 L 582.0 119.5 L 587.6 117.5 L 593.3 115.4 L 598.9 113.4 L 604.6 111.3" fill="none" stroke="#3C6E9F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <line x1="96.0" y1="176.1" x2="600.0" y2="176.1" stroke="#C0392B" stroke-width="1.2" opacity="0.8" stroke-dasharray="5 4"/>
  <text x="606.0" y="179.1" font-size="8.5" fill="#C0392B" text-anchor="start" font-weight="400" opacity="1.0">33 ms = 1 帧</text>
  <circle cx="410.0" cy="181.8" r="3.2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="403.0" y="161.8" font-size="8.5" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">24 ms</text>
  <circle cx="497.9" cy="149.9" r="3.2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="490.9" y="140.9" font-size="8.5" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">144 ms</text>
  <circle cx="600.0" cy="113.0" r="3.2" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="593.0" y="104.0" font-size="8.5" fill="#3C6E9F" text-anchor="end" font-weight="600" opacity="1.0">1152 ms</text>
  <text x="150.0" y="120.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">在这条线以下，漂移小于一帧，</text>
  <text x="150.0" y="136.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">大多数任务可以忽略 —— 很多</text>
  <text x="150.0" y="152.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">实验室的小数据集就在这个区。</text>
  <line x1="24.0" y1="382.0" x2="736.0" y2="382.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="404.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">斜坡和噪声的区别在于能不能平均掉：噪声除以 √N 会变小，斜坡不会。所以漂移只能靠同步</text>
  <text x="24.0" y="424.0" font-size="10" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">机制消掉，或者靠足够长的观测窗口事后拟合 —— 后者要多久，见第 5 节。</text>
</svg>
