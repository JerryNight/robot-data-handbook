  <text x="38.0" y="334.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="400" opacity="1.0">30 条的区间 [0.44, 0.93] 同时跨过「返工」和「可信」两条线；</text>
  <text x="38.0" y="347.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">2000 次重抽里有 28% 判可信、1.6% 判返工——真值是 0.73，两种判读都错。</text>
