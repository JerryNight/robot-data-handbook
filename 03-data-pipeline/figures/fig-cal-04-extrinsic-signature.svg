  <text x="604.0" y="122.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">看形状，不看大小</text>
  <text x="604.0" y="146.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">残差窄但整体偏 →</text>
  <text x="604.0" y="162.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">查平移（安装位置）</text>
  <text x="604.0" y="186.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">残差随位置涨 →</text>
  <text x="604.0" y="202.0" font-size="9" fill="#C0392B" text-anchor="start" font-weight="600" opacity="1.0">查旋转（装配角度）</text>
  <line x1="24.0" y1="340.0" x2="736.0" y2="340.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="362.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">纯旋转的残差 = 2·|p_end|·sin(Δθ/2)，所以是一条过原点的直线；纯平移与 |p_end| 无关，是一条水平线。</text>
  <text x="24.0" y="384.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">两种误差同时存在时（表里最后一行）相关性掉到 r=0.88——趋势还在，但不再是干净的直线。</text>
  <text x="24.0" y="406.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">这条判据比重新标一次快，而且不用停机：先分清类型，再去查那一类对应的机械环节。</text>
</svg>
