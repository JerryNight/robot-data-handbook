<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24.0" y="30.0" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">把标定板做大是线性收益，加点只是平方根</text>
  <text x="24.0" y="52.0" font-size="10.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">300 mm 已知位移、0.2 px 像素噪声、每组 400 次。纵轴 σ_f 用对数刻度。</text>
  <line x1="92.0" y1="292.0" x2="560.0" y2="292.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="92.0" y1="292.0" x2="92.0" y2="96.0" stroke="#1F2328" stroke-width="1.2" opacity="1.0"/>
  <line x1="87.0" y1="274.7" x2="92.0" y2="274.7" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="83.0" y="277.7" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">1</text>
  <line x1="92.0" y1="274.7" x2="560.0" y2="274.7" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="87.0" y1="220.9" x2="92.0" y2="220.9" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="83.0" y="223.9" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">2</text>
  <line x1="92.0" y1="220.9" x2="560.0" y2="220.9" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="87.0" y1="149.8" x2="92.0" y2="149.8" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="83.0" y="152.8" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">5</text>
  <line x1="92.0" y1="149.8" x2="560.0" y2="149.8" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="87.0" y1="96.0" x2="92.0" y2="96.0" stroke="#1F2328" stroke-width="1" opacity="1.0"/>
  <text x="83.0" y="99.0" font-size="8.5" fill="#8A94A0" text-anchor="end" font-weight="400" opacity="1.0">10</text>
  <line x1="92.0" y1="96.0" x2="560.0" y2="96.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="83.0" y="84.0" font-size="8.5" fill="#57606A" text-anchor="end" font-weight="400" opacity="1.0">σ_f（px，对数轴）</text>
  <text x="326.0" y="328.0" font-size="9" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">标定板宽度（括号内是 1 m 处占画面的比例）</text>
  <text x="170.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">100 mm（9%）</text>
  <text x="326.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">200 mm（19%）</text>
  <text x="482.0" y="309.0" font-size="8.5" fill="#57606A" text-anchor="middle" font-weight="400" opacity="1.0">400 mm（38%）</text>
  <path d="M 170.0 124.7 L 326.0 176.4 L 482.0 222.5" fill="none" stroke="#3C6E9F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <circle cx="170.0" cy="124.7" r="3.4" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="326.0" cy="176.4" r="3.4" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="482.0" cy="222.5" r="3.4" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <path d="M 170.0 146.3 L 326.0 199.4 L 482.0 248.3" fill="none" stroke="#6B5B95" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <circle cx="170.0" cy="146.3" r="3.4" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="326.0" cy="199.4" r="3.4" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="482.0" cy="248.3" r="3.4" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <path d="M 170.0 174.2 L 326.0 222.3 L 482.0 279.0" fill="none" stroke="#2E7D5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1.0"/>
  <circle cx="170.0" cy="174.2" r="3.4" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="326.0" cy="222.3" r="3.4" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="1.0"/>
  <circle cx="482.0" cy="279.0" r="3.4" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="1.0"/>
  <rect x="586.0" y="96.0" width="150.0" height="84.0" rx="6" fill="#F7F9FB" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <line x1="598.0" y1="118.0" x2="620.0" y2="118.0" stroke="#3C6E9F" stroke-width="2.2" opacity="1.0"/>
  <circle cx="609.0" cy="118.0" r="3.4" fill="#3C6E9F" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="628.0" y="122.0" font-size="9" fill="#3C6E9F" text-anchor="start" font-weight="600" opacity="1.0">40 点</text>
  <line x1="598.0" y1="140.0" x2="620.0" y2="140.0" stroke="#6B5B95" stroke-width="2.2" opacity="1.0"/>
  <circle cx="609.0" cy="140.0" r="3.4" fill="#6B5B95" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="628.0" y="144.0" font-size="9" fill="#6B5B95" text-anchor="start" font-weight="600" opacity="1.0">80 点</text>
  <line x1="598.0" y1="162.0" x2="620.0" y2="162.0" stroke="#2E7D5B" stroke-width="2.2" opacity="1.0"/>
  <circle cx="609.0" cy="162.0" r="3.4" fill="#2E7D5B" stroke="none" stroke-width="0" opacity="1.0"/>
  <text x="628.0" y="166.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="600" opacity="1.0">160 点</text>
  <text x="600.0" y="206.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">板宽 ×4 → σ_f ÷3.5</text>
  <text x="600.0" y="226.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">点数 ×4 → σ_f ÷1.9</text>
  <text x="600.0" y="250.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">线性收益 vs</text>
  <text x="600.0" y="264.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">平方根收益</text>
  <line x1="24.0" y1="336.0" x2="736.0" y2="336.0" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="24.0" y="358.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">σ_m ≈ σ_px·√12 /(板宽·√点数)——分母里就是这两项，一个线性一个平方根。</text>
  <text x="24.0" y="380.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">想让点数的收益赶上板宽，点要密 12 倍。所以「让板占满画面」不是审美要求，是分母。</text>
  <text x="24.0" y="402.0" font-size="10" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">多拍几张之所以也有用，是因为不同姿态把板摊到画面各处，等效放大了「有效板宽」。</text>
</svg>
