  <text x="550.0" y="166.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">1,000 集 → 36.8%</text>
  <text x="550.0" y="183.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">5,000 集 → 0.67%</text>
  <text x="550.0" y="200.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">10,000 集 → 0.005%</text>
  <line x1="550.0" y1="226.0" x2="574.0" y2="226.0" stroke="#C0651A" stroke-width="2.4" opacity="1.0" stroke-dasharray="5 4"/>
  <text x="580.0" y="230.0" font-size="8.5" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">单集失败率 0.01%</text>
  <text x="550.0" y="246.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">5,000 集 → 61%</text>
  <text x="550.0" y="263.0" font-size="8.5" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">10,000 集 → 37%</text>
  <text x="550.0" y="284.0" font-size="9" fill="#2E7D5B" text-anchor="start" font-weight="600" opacity="1.0">→ 拆成小 job 才可重试</text>
  <text x="24.0" y="356.0" font-size="9.5" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">两条线的斜率不同，结论一致：n 一大，指数项就没有「够低」的时候。</text>
  <text x="24.0" y="376.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">把单集失败率压到 0.01%（难 10 倍），5,000 集也只有 61%，10,000 集仍然只有 37%。</text>
  <text x="24.0" y="394.0" font-size="9" fill="#57606A" text-anchor="start" font-weight="400" opacity="1.0">拆成 5,000 个能重试的小 job，只要单集能重试成功，整体成功率就是 100%。</text>
</svg>
