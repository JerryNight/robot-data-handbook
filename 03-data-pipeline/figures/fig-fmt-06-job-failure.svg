  <text x="467.1" y="99.0" font-size="9" fill="#C0651A" text-anchor="start" font-weight="600" opacity="1.0">61%</text>
  <rect x="536.0" y="100.0" width="200.0" height="200.0" rx="6" fill="#F7F9FB" stroke="#E4E8EC" stroke-width="1" opacity="1.0"/>
  <text x="550.0" y="122.0" font-size="9" fill="#1F2328" text-anchor="start" font-weight="600" opacity="1.0">一次跑完全部的概率</text>
  <line x1="550.0" y1="146.0" x2="574.0" y2="146.0" stroke="#C0392B" stroke-width="2.4" opacity="1.0"/>
