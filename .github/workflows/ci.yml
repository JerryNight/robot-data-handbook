name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: run examples (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 所有示例只依赖标准库，所以这一步不需要 pip install。
      # 一旦有人偷偷引入了第三方依赖，CI 会立刻红。
      - name: Run all examples
        run: python scripts/run_all_examples.py

  links:
    name: check markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative links in markdown
        run: python scripts/check_links.py
